<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#065f46">
<title>AXIION Business Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#059669;--g2:#10b981;--gd:#065f46;--gl:#ecfdf5;--re:#dc2626;--rel:#fef2f2;--am:#d97706;--aml:#fffbeb;--bl:#2563eb;--bll:#eff6ff;--pu:#7c3aed;
--bg:#f5f8f6;--card:#fff;--bd:#e3ebe6;--tx:#0f1d17;--mt:#5b6e64;--mt2:#8a9b92;--sh:0 1px 2px rgba(15,29,23,.06),0 4px 14px rgba(15,29,23,.05);--r:14px;
--font:'Hind Siliguri','Noto Sans Bengali','Segoe UI',system-ui,-apple-system,sans-serif;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#07130e;--card:#0e1f17;--bd:#1b3327;--tx:#e8f6ee;--mt:#9bb1a5;--mt2:#6b8174;--gl:#0f2a1e;--rel:#2b1512;--aml:#2b1f0a;--bll:#0d1f3a;--sh:0 1px 2px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--tx);font-size:15px;line-height:1.45;font-variant-numeric:lining-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--g)}
#app{display:flex;flex-direction:column;min-height:100%}
.hdr{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#03130d,var(--gd));color:#fff;padding:calc(10px + var(--sat)) 14px 10px;display:flex;align-items:center;gap:10px}
.hdr h1{font-size:16px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr small{display:block;font-size:11px;font-weight:400;opacity:.75}
.hbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:7px 11px;font-size:16px;cursor:pointer;line-height:1}
main{flex:1;padding:14px 12px calc(86px + var(--sab));max-width:980px;width:100%;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:4px 4px calc(4px + var(--sab));box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.nav button{flex:1;background:none;border:0;padding:6px 2px;color:var(--mt);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:10px}
.nav button .i{font-size:20px;line-height:1.1}
.nav button.on{color:var(--g);font-weight:600;background:var(--gl)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:560px){.g4{grid-template-columns:1fr 1fr}.g3.keep{grid-template-columns:repeat(3,1fr)}}
@media(max-width:420px){.g3:not(.keep){grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--g);border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.stat .l{font-size:12px;color:var(--mt)}.stat .v{font-size:19px;font-weight:700;margin-top:2px;word-break:break-word}.stat .s{font-size:11px;color:var(--mt2)}
.stat.re{border-top-color:var(--re)}.stat.am{border-top-color:var(--am)}.stat.bl{border-top-color:var(--bl)}.stat.pu{border-top-color:var(--pu)}
.stat.click{cursor:pointer}
.btn{border:0;border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--g);color:#fff;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.98)}.btn.sec{background:var(--gl);color:var(--g)}.btn.out{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.red{background:var(--re)}.btn.am{background:var(--am)}.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}.btn.blk{width:100%}.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:block;font-size:12px;color:var(--mt);margin:0 0 3px;font-weight:500}
.in,select.in,textarea.in{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font-size:15px;outline:none}
.in:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(5,150,105,.15)}
textarea.in{min-height:60px;resize:vertical}
.fld{margin-bottom:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--mt)}
.tab.on{background:var(--g);color:#fff;border-color:var(--g);font-weight:600}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--gl);color:var(--g);font-weight:600}
.chip.re{background:var(--rel);color:var(--re)}.chip.am{background:var(--aml);color:var(--am)}.chip.bl{background:var(--bll);color:var(--bl)}.chip.gr{background:var(--bd);color:var(--mt)}
.li{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.li:last-child{border-bottom:0}.li .t{font-weight:600}.li .s{font-size:12px;color:var(--mt)}.li .r{text-align:right;white-space:nowrap}
.re{color:var(--re)}.gr{color:var(--g)}.am{color:var(--am)}.mt{color:var(--mt)}.b{font-weight:700}.sm{font-size:12px}.c{text-align:center}.rt{text-align:right}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:var(--gl);color:var(--g);text-align:left;padding:7px 8px;font-weight:600;white-space:nowrap;position:sticky;top:0}
table.tb td{padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}
table.tb td.n,table.tb th.n{text-align:right;white-space:nowrap}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
.empty{text-align:center;color:var(--mt2);padding:28px 10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .2s}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sheet .sh{padding:14px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bd);background:var(--card);border-radius:20px 20px 0 0}
.sheet .sh h2{margin:0;font-size:16px;flex:1}.sheet .sb{padding:14px 16px;overflow-y:auto;flex:1}.sheet .sf{padding:12px 16px calc(12px + var(--sab));border-top:1px solid var(--bd);background:var(--card);display:flex;gap:8px}
.x{background:none;border:0;font-size:22px;color:var(--mt);cursor:pointer;padding:0 4px}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.5}}
.drawer{position:fixed;inset:0;z-index:50;display:none}.drawer.on{display:block}
.drawer .bk{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.drawer .pn{position:absolute;top:0;bottom:0;left:0;width:84%;max-width:320px;background:var(--card);overflow-y:auto;padding:calc(14px + var(--sat)) 10px 20px;animation:sl .2s}
@keyframes sl{from{transform:translateX(-30px);opacity:.4}}
.drawer .gh{font-size:11px;color:var(--mt2);padding:10px 10px 4px;letter-spacing:.3px}
.drawer .mi{display:flex;gap:12px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;font-size:15px}
.drawer .mi.on{background:var(--gl);color:var(--g);font-weight:600}.drawer .mi .i{width:24px;text-align:center;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:420px}
.tt{background:#0f1d17;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fi .15s}.tt.er{background:var(--re)}
.pick{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:9px 11px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:42px}
.pick .ph{color:var(--mt2)}
.qty{display:flex;gap:6px;align-items:center}.qty .in{padding:7px 8px;text-align:center;min-width:0}
.item{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--card)}
.sum{background:var(--gl);border-radius:12px;padding:10px 12px}.sum .row{padding:2px 0}.sum .tot{font-size:17px;font-weight:700;border-top:1px dashed var(--bd);margin-top:4px;padding-top:6px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:6px}
.login{max-width:380px;margin:0 auto;padding:calc(40px + var(--sat)) 18px}
.logo{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--g2),var(--gd));color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 14px}
.spin{width:22px;height:22px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:rot .7s linear infinite;margin:30px auto}@keyframes rot{to{transform:rotate(360deg)}}
.ledger .dr{color:var(--re)}.ledger .cr{color:var(--g)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .d{font-size:11px;text-align:center;padding:5px 0;border-radius:6px;background:var(--card);border:1px solid var(--bd);cursor:pointer}
.sparkline{display:flex;align-items:flex-end;gap:5px;height:90px}.sparkline div{flex:1;background:linear-gradient(var(--g2),var(--g));border-radius:5px 5px 0 0;min-height:3px;position:relative}
.sparkline span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mt2);white-space:nowrap}
#print-area{display:none}
@media print{body>*:not(#print-area){display:none!important}#print-area{display:block!important;color:#000;background:#fff}@page{margin:10mm}}
.inv{font-family:var(--font);font-size:13px;color:#000;max-width:700px;margin:0 auto}.inv h2{margin:0;text-align:center}.inv .c{text-align:center}
.inv table{width:100%;border-collapse:collapse;margin:8px 0}.inv th,.inv td{border-bottom:1px solid #999;padding:4px 3px;text-align:left}.inv .n{text-align:right}.inv .tot td{font-weight:700;border-top:2px solid #000}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="print-area"></div>
<script>
'use strict';
/* ═══ AXIION Business Manager — owner + manager app ═══ */
var S = { user: null, set: {}, token: '', cache: {}, page: 'home', arg: '' };
try { S.token = localStorage.getItem('bm_token') || ''; } catch (e) {}

/* ── tiny helpers ── */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { var n = parseFloat(String(v == null ? '' : v).replace(/,/g, '')); return isFinite(n) ? n : 0; }
function fmt(n, d) { n = num(n); var neg = n < 0; n = Math.abs(n); var r = n.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: d == null ? 2 : d }); return (neg ? '-' : '') + r; }
function tk(n) { return '৳' + fmt(n); }
function today() { return new Date(Date.now() + 6 * 3600e3).toISOString().slice(0, 10); }
function addDays(d, k) { var t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + k); return t.toISOString().slice(0, 10); }
function monthStart(d) { return (d || today()).slice(0, 8) + '01'; }
var MON = ['জানু', 'ফেব্রু', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টে', 'অক্টো', 'নভে', 'ডিসে'];
function dfmt(d) { if (!d) return ''; var p = String(d).slice(0, 10).split('-'); return +p[2] + ' ' + MON[+p[1] - 1] + ' ' + String(p[0]).slice(2); }
function ago(d) { if (!d) return ''; var k = Math.round((new Date(today()) - new Date(String(d).slice(0, 10))) / 864e5); return k <= 0 ? 'আজ' : k + ' দিন আগে'; }
function qtyTxt(u, p) { u = num(u); var cs = p && p.case_size > 1 ? p.case_size : 0; if (!cs) return fmt(u) + ' ' + (p && p.unit_name || 'পিস'); var c = Math.floor(Math.abs(u) / cs) * (u < 0 ? -1 : 1), r = Math.round((u - c * cs) * 100) / 100; return (c ? fmt(c) + ' ' + (p.case_name || 'কেস') : '') + (c && r ? ' ' : '') + (r || !c ? fmt(r) + ' ' + (p.unit_name || 'পিস') : ''); }
var METHODS = { cash: 'নগদ', bank: 'ব্যাংক', bkash: 'বিকাশ', nagad: 'নগদ (অ্যাপ)', rocket: 'রকেট', cheque: 'চেক' };
function methodOpts(sel) { return Object.keys(METHODS).map(function (k) { return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + METHODS[k] + '</option>'; }).join(''); }
function uid() { return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'x' + Date.now() + Math.random().toString(36).slice(2); }
function debounce(f, ms) { var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { f.apply(s, a); }, ms); }; }
function perm(k) { return !!(S.set.perms && S.set.perms[k]); }
function isOwner() { return S.user && S.user.role === 'owner'; }

/* ── API ── */
async function api(file, params, body, method) {
  var qs = params ? '?' + new URLSearchParams(Object.keys(params).filter(function (k) { return params[k] !== '' && params[k] != null; }).reduce(function (o, k) { o[k] = params[k]; return o; }, {})).toString() : '';
  var m = method || (body ? 'POST' : 'GET');
  var r, j;
  try {
    r = await fetch('/api/' + file + qs, { method: m, headers: { 'Content-Type': 'application/json', Authorization: S.token ? 'Bearer ' + S.token : '' }, body: body ? JSON.stringify(body) : undefined });
    j = await r.json();
  } catch (e) { throw new Error('ইন্টারনেট/সার্ভারে সমস্যা — আবার চেষ্টা করুন'); }
  if (r.status === 401 && S.user) { doLogout(true); throw new Error(j.error || 'আবার লগইন করুন'); }
  if (!j.ok) throw new Error(j.error || 'কিছু একটা ভুল হয়েছে');
  return j;
}
function toast(msg, err) { var t = document.createElement('div'); t.className = 'tt' + (err ? ' er' : ''); t.textContent = msg; $('#toast').appendChild(t); setTimeout(function () { t.remove(); }, err ? 4500 : 2200); }
async function run(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { var r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); return undefined; }
  finally { if (btn) btn.disabled = false; }
}

/* ── cached lists ── */
async function list(name, force) {
  if (!force && S.cache[name]) return S.cache[name];
  var j = await api('data', { t: name, all: name === 'products' ? '' : '' });
  S.cache[name] = j.rows; return j.rows;
}
function bust() { S.cache = {}; }
function byId(arr, id) { for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }

/* ── modal / sheets ── */
var MODALS = [];
function modal(title, body, opts) {
  opts = opts || {};
  var ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = '<div class="sheet"' + (opts.wide ? ' style="max-width:860px"' : '') + '><div class="sh"><h2>' + title + '</h2><button class="x" data-x>×</button></div><div class="sb">' + body + '</div>' + (opts.footer ? '<div class="sf">' + opts.footer + '</div>' : '') + '</div>';
  document.body.appendChild(ov);
  var m = { el: ov, q: function (s) { return $(s, ov); }, close: function () { ov.remove(); MODALS = MODALS.filter(function (x) { return x !== m; }); if (opts.onClose) opts.onClose(); } };
  ov.addEventListener('mousedown', function (e) { if (e.target === ov && !opts.sticky) m.close(); });
  $('[data-x]', ov).onclick = function () { m.close(); };
  MODALS.push(m); return m;
}
function closeAll() { MODALS.slice().forEach(function (m) { m.close(); }); }
function confirmBox(msg, okText, danger) {
  return new Promise(function (res) {
    var done = false;
    var m = modal('নিশ্চিত করুন', '<div style="font-size:15px;white-space:pre-line">' + esc(msg) + '</div>', { footer: '<button class="btn out grow" data-n>না</button><button class="btn grow ' + (danger ? 'red' : '') + '" data-y>' + (okText || 'হ্যাঁ') + '</button>', onClose: function () { if (!done) res(false); } });
    m.q('[data-n]').onclick = function () { m.close(); };
    m.q('[data-y]').onclick = function () { done = true; m.close(); res(true); };
  });
}
function askText(title, label, ph) {
  return new Promise(function (res) {
    var done = false;
    var m = modal(title, '<div class="fld"><label class="f">' + label + '</label><input class="in" id="at" placeholder="' + esc(ph || '') + '"></div>', { footer: '<button class="btn out grow" data-n>বাতিল</button><button class="btn grow" data-y>ঠিক আছে</button>', onClose: function () { if (!done) res(null); } });
    m.q('[data-n]').onclick = function () { m.close(); };
    m.q('[data-y]').onclick = function () { done = true; var v = m.q('#at').value.trim(); m.close(); res(v); };
    setTimeout(function () { m.q('#at').focus(); }, 60);
  });
}
/* searchable picker. items: [{id,t,s,r,hay}] → resolves to chosen item or null */
function pick(title, items, opts) {
  opts = opts || {};
  return new Promise(function (res) {
    var done = false;
    var m = modal(title, '<input class="in" id="ps" placeholder="🔍 খুঁজুন…" style="margin-bottom:10px"><div id="pl"></div>', { onClose: function () { if (!done) res(null); } });
    function draw() {
      var q = m.q('#ps').value.trim().toLowerCase();
      var arr = items.filter(function (i) { return !q || (i.hay || (i.t + ' ' + (i.s || ''))).toLowerCase().indexOf(q) >= 0; }).slice(0, 80);
      m.q('#pl').innerHTML = (opts.extra ? '<div class="li" data-i="__extra"><div class="grow t">' + opts.extra + '</div></div>' : '') + (arr.map(function (i) { return '<div class="li" data-i="' + esc(i.id) + '"><div class="grow"><div class="t">' + esc(i.t) + '</div>' + (i.s ? '<div class="s">' + esc(i.s) + '</div>' : '') + '</div>' + (i.r ? '<div class="r">' + i.r + '</div>' : '') + '</div>'; }).join('') || '<div class="empty">কিছু পাওয়া যায়নি</div>');
    }
    draw(); m.q('#ps').oninput = debounce(draw, 120);
    m.q('#pl').onclick = function (e) {
      var li = e.target.closest('[data-i]'); if (!li) return;
      var id = li.getAttribute('data-i'); done = true; m.close();
      res(id === '__extra' ? { id: '' } : items.filter(function (i) { return i.id === id; })[0] || null);
    };
    setTimeout(function () { m.q('#ps').focus(); }, 80);
  });
}
async function pickShop(extra) {
  var shops = await list('shops');
  return pick('দোকান বেছে নিন', shops.map(function (s) { return { id: s.id, t: s.name, s: [s.code, s.area, s.phone].filter(Boolean).join(' · '), hay: [s.name, s.code, s.area, s.phone, s.keeper].join(' '), r: num(s.balance) > 0 ? '<span class="re b">' + tk(s.balance) + '</span>' : '' }; }), { extra: extra });
}
async function pickProduct() {
  var ps = await list('products');
  return pick('পণ্য বেছে নিন', ps.map(function (p) { return { id: p.id, t: p.name, s: [p.category, qtyTxt(p.stock, p) + ' স্টক'].filter(Boolean).join(' · '), hay: [p.name, p.sku, p.category].join(' '), r: '<span class="b">' + tk(p.selling_price) + '</span>' }; }));
}
async function pickEmployee() {
  var es = await list('employees');

function dateIn(id, v) { return '<input type="date" class="in" id="' + id + '" value="' + (v || today()) + '">'; }
function fld(label, inner, cls) { return '<div class="fld ' + (cls || '') + '"><label class="f">' + label + '</label>' + inner + '</div>'; }
function stat(l, v, s, cls, click) { return '<div class="stat ' + (cls || '') + (click ? ' click' : '') + '"' + (click ? ' onclick="' + click + '"' : '') + '><div class="l">' + l + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>'; }
function spin() { return '<div class="spin"></div>'; }

/* CSV */
function toCSV(rows) { return '\ufeff' + rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n'); }
function download(name, text, mime) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); URL.revokeObjectURL(a.href); }, 500); }
function parseCSV(t) {
  var rows = [], r = [], c = '', q = false; t = t.replace(/^\ufeff/, '');
  for (var i = 0; i < t.length; i++) { var ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true; else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n') { r.push(c); rows.push(r); r = []; c = ''; } else if (ch !== '\r') c += ch; }
  if (c || r.length) { r.push(c); rows.push(r); }
  return rows.filter(function (x) { return x.some(function (y) { return y.trim(); }); });
}

async function route() {
  if (!S.user) return;
  var h = (location.hash || '#home').slice(1), i = h.indexOf(':');
  var p = i < 0 ? h : h.slice(0, i), arg = i < 0 ? '' : h.slice(i + 1);
  if (!PAGES[p]) { p = 'home'; arg = ''; }
  S.page = p; S.arg = arg;
  $('#ht').innerHTML = esc(pageLabel(p) || 'হোম') + '<small>' + esc(S.set.business_name || '') + '</small>';
  $$('#nav button').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-n') === p); });
  var el = $('#main'); el.innerHTML = spin(); window.scrollTo(0, 0);
  try { await PAGES[p](el, arg); } catch (e) { el.innerHTML = '<div class="card empty">⚠️ ' + esc(e.message) + '<br><br><button class="btn sec" onclick="route()">আবার চেষ্টা</button></div>'; }
}
window.addEventListener('hashchange', function () { closeAll(); route(); });

/* ── login / setup / logout ── */
async function boot() {
  if (S.token) {
    try { var j = await api('auth', { action: 'me' }); S.user = j.user; S.set = j.settings; shell(); if (!location.hash) location.hash = '#home'; return route(); } catch (e) { S.token = ''; }
  }
  var st; try { st = await api('auth', { action: 'status' }); } catch (e) { $('#app').innerHTML = '<div class="login"><div class="logo">⚠️</div><div class="card c">' + esc(e.message) + '<br><br><button class="btn" onclick="boot()">আবার চেষ্টা</button></div></div>'; return; }
  loginScreen(st.needsSetup, st.business);
}
function loginScreen(setup, biz) {
  $('#app').innerHTML = '<div class="login"><div class="logo">📦</div><h2 class="c" style="margin:0 0 4px">' + esc(biz || 'AXIION Business Manager') + '</h2><div class="c mt sm" style="margin-bottom:18px">' + (setup ? 'প্রথমবার সেটআপ — মালিকের অ্যাকাউন্ট তৈরি করুন' : 'লগইন করুন') + '</div><div class="card">' +
    (setup ? fld('ব্যবসার নাম', '<input class="in" id="lb" placeholder="যেমন: রহমান ট্রেডার্স">') + fld('আপনার নাম', '<input class="in" id="ln" placeholder="মালিকের নাম">') : '') +
    fld('ইউজারনেম' + (setup ? ' (ইংরেজিতে, যেমন owner)' : ''), '<input class="in" id="lu" autocapitalize="off" autocomplete="username">') +
    fld('পিন' + (setup ? ' (৪–৮ সংখ্যা)' : ''), '<input class="in" id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="current-password">') +
    '<button class="btn blk" id="lg">' + (setup ? 'শুরু করুন' : 'লগইন') + '</button></div></div>';
  var go_ = async function () {
    var b = $('#lg');
    var body = { username: $('#lu').value, pin: $('#lp').value };
    if (setup) { body.name = $('#ln').value; body.business_name = $('#lb').value; }
    var j = await run(b, function () { return api('auth', { action: setup ? 'setup' : 'login' }, body); });
    if (!j) return;
    S.token = j.token; try { localStorage.setItem('bm_token', S.token); } catch (e) {}
    S.user = j.user; var me = await api('auth', { action: 'me' }); S.set = me.settings; bust(); shell(); location.hash = '#home'; route();
    if (j.mustChange) setTimeout(function () { changePin(true); }, 400);
  };
  $('#lg').onclick = go_; $('#lp').onkeydown = function (e) { if (e.key === 'Enter') go_(); };
}
function doLogout(silent) { S.token = ''; S.user = null; bust(); try { localStorage.removeItem('bm_token'); } catch (e) {} if (!silent || true) boot(); }
function changePin(force) {
  var m = modal('পিন বদলান', (force ? '<div class="card" style="background:var(--aml)">নিরাপত্তার জন্য নিজের পিন বদলে নিন।</div>' : '') + fld('বর্তমান পিন', '<input class="in" id="p0" type="password" inputmode="numeric">') + fld('নতুন পিন (৪–৮ সংখ্যা)', '<input class="in" id="p1" type="password" inputmode="numeric" maxlength="8">'), { footer: '<button class="btn grow" id="ps_">সেভ</button>' });
  m.q('#ps_').onclick = async function () { var ok = await run(this, function () { return api('auth', { action: 'change-pin' }, { old: m.q('#p0').value, new: m.q('#p1').value }); }, 'পিন বদলানো হয়েছে'); if (ok) m.close(); };
}

/* ═══ NEW SALE ═══ */
var SALE = null;
function newSale() { SALE = { shop: null, emp: null, items: [], disc: '', comm: '', paid: '', paidTouched: false, method: 'cash', date: today(), note: '', token: uid() }; }
function saleUnits(it) { var p = it.p; return num(it.c) * (p.case_size > 1 ? p.case_size : 1) + num(it.u); }
function saleTotals() {
  var sub = 0; SALE.items.forEach(function (it) { sub += Math.round(saleUnits(it) * num(it.price) * 100) / 100; });
  var net = Math.max(0, sub - num(SALE.disc) - num(SALE.comm));
  if (!SALE.paidTouched && !SALE.shop) SALE.paid = net ? String(net) : '';
  return { sub: sub, net: net, paid: num(SALE.paid), due: net - num(SALE.paid) };
}
PAGES.sale = async function (el) {
  if (!SALE) newSale();
  await Promise.all([list('products'), list('shops'), list('employees')]);
  el.innerHTML =
    '<div class="card"><div class="grid g2">' + fld('তারিখ', dateIn('sd', SALE.date)) + fld('জমার মাধ্যম', '<select class="in" id="sm">' + methodOpts(SALE.method) + '</select>') + '</div>' +
    fld('দোকান', '<div class="pick" id="sshop"></div>') + fld('কর্মী (কে রিপোর্ট দিয়েছে — ঐচ্ছিক)', '<div class="pick" id="semp"></div>') + '</div>' +
    '<div class="card"><div class="row sp" style="margin-bottom:8px"><h3 style="margin:0">পণ্য</h3><button class="btn sm" id="sadd">＋ পণ্য যোগ</button></div><div id="sitems"></div></div>' +
    '<div class="card"><div class="grid g2">' + fld('ছাড় (টাকা)', '<input class="in" id="sdisc" type="number" inputmode="decimal" min="0" placeholder="0">') + fld('কমিশন (টাকা)', '<input class="in" id="scomm" type="number" inputmode="decimal" min="0" placeholder="0">') + '</div>' +
    '<div class="sum" id="ssum" style="margin:6px 0 12px"></div>' +
    fld('এখন কত টাকা জমা নিলেন?', '<div class="row"><input class="in grow" id="spaid" type="number" inputmode="decimal" min="0" placeholder="0"><button class="btn sec sm" id="sfull">পুরোটা</button></div>') +
    fld('নোট (ঐচ্ছিক)', '<input class="in" id="snote">') +
    '<button class="btn blk" id="ssave" style="padding:13px;font-size:16px">✅ বিক্রয় সেভ করুন</button><button class="btn out blk" id="sreset" style="margin-top:8px">নতুন করে শুরু</button></div>';
  $('#sd').value = SALE.date; $('#sdisc').value = SALE.disc; $('#scomm').value = SALE.comm; $('#spaid').value = SALE.paid; $('#snote').value = SALE.note;
  $('#sd').onchange = function () { SALE.date = this.value; }; $('#sm').onchange = function () { SALE.method = this.value; };
  $('#sdisc').oninput = function () { SALE.disc = this.value; saleCalc(); }; $('#scomm').oninput = function () { SALE.comm = this.value; saleCalc(); };
  $('#spaid').oninput = function () { SALE.paid = this.value; SALE.paidTouched = true; saleCalc(true); }; $('#snote').oninput = function () { SALE.note = this.value; };
  $('#sfull').onclick = function () { var t = saleTotals(); SALE.paid = String(t.net); SALE.paidTouched = true; $('#spaid').value = SALE.paid; saleCalc(true); };
  $('#sshop').onclick = async function () { var s = await pickShop('🚶 নগদ ক্রেতা (দোকান ছাড়া)'); if (!s) return; SALE.shop = s.id ? byId(S.cache.shops, s.id) : null; if (!SALE.paidTouched) SALE.paid = ''; saleHead(); saleCalc(); if (SALE.shop && SALE.shop.employee_name) { var e = S.cache.employees.filter(function (x) { return x.name === SALE.shop.employee_name; })[0]; if (e && !SALE.emp) { SALE.emp = e; saleHead(); } } };
  $('#semp').onclick = async function () { var e = await pickEmployee(); if (!e) return; SALE.emp = e.id ? byId(S.cache.employees, e.id) : null; saleHead(); };
  $('#sadd').onclick = async function () { var p = await pickProduct(); if (!p) return; var pr = byId(S.cache.products, p.id); var ex = SALE.items.filter(function (i) { return i.p.id === pr.id; })[0]; if (ex) { toast('এই পণ্য আগেই যোগ করা আছে'); return; } SALE.items.push({ p: pr, c: '', u: '', price: pr.selling_price }); saleItems(); setTimeout(function () { var f = $('#sitems .item:last-child input'); if (f) f.focus(); }, 50); };
  $('#sreset').onclick = async function () { if (!SALE.items.length || await confirmBox('ফর্ম খালি করে নতুন করে শুরু করবেন?')) { newSale(); PAGES.sale(el); } };
  $('#ssave').onclick = saleSave;
  saleHead(); saleItems(); saleCalc();
};
function saleHead() {
  var s = SALE.shop;
  $('#sshop').innerHTML = s ? '<div><b>' + esc(s.name) + '</b><div class="sm mt">' + esc([s.code, s.area].filter(Boolean).join(' · ')) + (num(s.balance) > 0 ? ' · <span class="re">আগের বাকি ' + tk(s.balance) + '</span>' : '') + (num(s.credit_limit) > 0 ? ' · সীমা ' + tk(s.credit_limit) : '') + '</div></div><span>▾</span>' : '<span class="ph">🚶 নগদ ক্রেতা — দোকান বেছে নিতে ট্যাপ করুন</span><span>▾</span>';

      m.q('#iprev').innerHTML = '<b>' + rows.length + 'টি সারি পাওয়া গেছে</b><div class="scroll"><table class="tb"><tr>' + c.cols.map(function (k) { return '<th>' + k + '</th>'; }).join('') + '</tr>' + rows.slice(0, 5).map(function (o) { return '<tr>' + c.cols.map(function (k) { return '<td>' + esc(o[k] || '') + '</td>'; }).join('') + '</tr>'; }).join('') + '</table></div>';

  CB.from = CB.from || today(); CB.to = CB.to || today();
  el.innerHTML = '<div class="card"><div class="grid g2">' + fld('থেকে', dateIn('cf', CB.from)) + fld('পর্যন্ত', dateIn('ct', CB.to)) + '</div><div class="row wrap"><button class="tab" data-r="0">আজ</button><button class="tab" data-r="1">গতকাল</button><button class="tab" data-r="7">৭ দিন</button><button class="tab" data-r="m">এই মাস</button></div></div><div id="cbody">' + spin() + '</div>';
  var load = async function () {
    if (!$('#cf')) return; CB.from = $('#cf').value; CB.to = $('#ct').value; var j = await api('reports', { action: 'cashbook', from: CB.from, to: CB.to }), r = j.r, one = CB.from === CB.to;
    var dc = one ? await api('ops', { action: 'day-close', date: CB.from }) : null;
    if (!$('#cbody')) return;
    $('#cbody').innerHTML = '<div class="grid g2">' + '<div class="card" style="margin:0"><h3>💵 নগদ (হাতে)</h3><div class="row sp"><span>শুরুতে</span><b>' + tk(r.cash_open) + '</b></div><div class="row sp"><span>আয়</span><b class="gr">+ ' + tk(r.cash_in) + '</b></div><div class="row sp"><span>ব্যয়</span><b class="re">− ' + tk(r.cash_out) + '</b></div><div class="row sp tot b" style="border-top:1px dashed var(--bd);margin-top:4px;padding-top:4px"><span>শেষে</span><b style="font-size:18px">' + tk(r.cash_close) + '</b></div></div>' +
      '<div class="card" style="margin:0"><h3>🏦 ব্যাংক / অনলাইন</h3><div class="row sp"><span>শুরুতে</span><b>' + tk(r.bank_open) + '</b></div><div class="row sp"><span>আয়</span><b class="gr">+ ' + tk(r.bank_in) + '</b></div><div class="row sp"><span>ব্যয়</span><b class="re">− ' + tk(r.bank_out) + '</b></div><div class="row sp tot b" style="border-top:1px dashed var(--bd);margin-top:4px;padding-top:4px"><span>শেষে</span><b style="font-size:18px">' + tk(r.bank_close) + '</b></div></div></div>' +
      '<div class="row wrap" style="margin:12px 0"><button class="btn sm" data-e="bank_deposit">🏦 ব্যাংকে জমা</button><button class="btn sm sec" data-e="bank_withdraw">💵 ব্যাংক থেকে তোলা</button><button class="btn sm sec" data-e="other_income">➕ অন্য আয়</button><button class="btn sm sec" data-e="other_out">➖ অন্য ব্যয়</button>' + (isOwner() ? '<button class="btn sm out" data-e="capital_in">মূলধন জমা</button><button class="btn sm out" data-e="owner_withdraw">মালিকের উত্তোলন</button>' : '') + '<button class="btn sm out" id="cbcsv">⬇ CSV</button></div>' +
      (dc ? '<div class="card"><h3>🔒 দিনশেষ হিসাব — ' + dfmt(CB.from) + '</h3>' + (dc.closed ? '<div class="sum">গুনে পাওয়া: <b>' + tk(dc.closed.counted_cash) + '</b> · সিস্টেম: ' + tk(dc.closed.expected_cash) + ' · <b class="' + (num(dc.closed.diff) === 0 ? 'gr' : 're') + '">' + (num(dc.closed.diff) === 0 ? 'মিলেছে ✔' : (num(dc.closed.diff) > 0 ? 'বেশি ' : 'কম ') + tk(Math.abs(dc.closed.diff))) + '</b><div class="sm mt">' + esc(dc.closed.by_name) + '</div></div>' : '') + '<div class="grid g2" style="margin-top:8px">' + fld('ক্যাশ বাক্সে গুনে কত পেলেন?', '<input class="in" id="dcc" type="number" inputmode="decimal" value="' + (dc.closed ? dc.closed.counted_cash : '') + '">') + fld('নোট', '<input class="in" id="dcn">') + '</div><button class="btn blk sec" id="dcs">' + (dc.closed ? 'আবার হিসাব মেলান' : 'দিন শেষ করুন') + '</button></div>' : '') +
      '<div class="card"><h3>লেনদেনের তালিকা</h3><div class="scroll"><table class="tb"><tr><th>তারিখ</th><th>বিবরণ</th><th>মাধ্যম</th><th class="n">আয়</th><th class="n">ব্যয়</th></tr>' + (r.rows.map(function (x) { return '<tr><td>' + dfmt(x.date) + '</td><td>' + esc(x.src) + (x.who ? '<div class="sm mt">' + esc(x.who) + '</div>' : '') + '</td><td>' + (METHODS[x.method] || x.method) + '</td><td class="n gr">' + (x.dir === 'in' ? fmt(x.amount) : '') + '</td><td class="n re">' + (x.dir === 'out' ? fmt(x.amount) : '') + '</td></tr>'; }).join('') || '<tr><td colspan="5" class="empty">কোনো লেনদেন নেই</td></tr>') + '</table></div></div>';
    $('#cbody').onclick = function (e) { var b = e.target.closest('[data-e]'); if (b) cashEntry(b.getAttribute('data-e'), load); };
    var csv = $('#cbcsv'); if (csv) csv.onclick = function () { download('cashbook_' + CB.from + '_' + CB.to + '.csv', toCSV([['তারিখ', 'বিবরণ', 'কার সাথে', 'মাধ্যম', 'আয়', 'ব্যয়']].concat(r.rows.map(function (x) { return [x.date, x.src, x.who, METHODS[x.method] || x.method, x.dir === 'in' ? x.amount : '', x.dir === 'out' ? x.amount : '']; })))); };
    var dcs = $('#dcs'); if (dcs) dcs.onclick = async function () { if ($('#dcc').value === '') return toast('গুনে পাওয়া টাকা দিন', true); var k = await run(this, function () { return api('ops', { action: 'day-close' }, { date: CB.from, counted_cash: $('#dcc').value, note: $('#dcn').value }); }); if (k) { toast(k.diff === 0 ? 'হিসাব মিলেছে ✔' : (k.diff > 0 ? 'ক্যাশ বেশি ' : 'ক্যাশ কম ') + tk(Math.abs(k.diff))); load(); } };
  };
  $('#cf').onchange = load; $('#ct').onchange = load;
  $$('[data-r]', el).forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-r'), t = today(); $('#ct').value = k === '1' ? addDays(t, -1) : t; $('#cf').value = k === '0' ? t : k === '1' ? addDays(t, -1) : k === '7' ? addDays(t, -6) : monthStart(); load(); }; });
  load();
};
function cashEntry(kind, done) {
  var T = { bank_deposit: 'ব্যাংকে জমা (নগদ থেকে)', bank_withdraw: 'ব্যাংক থেকে নগদ তোলা', other_income: 'অন্য আয় (নগদ/অনলাইন)', other_out: 'অন্য ব্যয়', capital_in: 'মূলধন জমা', owner_withdraw: 'মালিকের উত্তোলন' };
  var bankish = kind === 'bank_deposit' || kind === 'bank_withdraw';
  var m = modal(T[kind], fld('টাকা *', '<input class="in" id="xa" type="number" inputmode="decimal" min="0">') + '<div class="grid g2">' + fld(bankish ? 'কোন অ্যাকাউন্ট' : 'মাধ্যম', '<select class="in" id="xm">' + (bankish ? '<option value="bank">ব্যাংক</option><option value="bkash">বিকাশ</option><option value="nagad">নগদ (অ্যাপ)</option><option value="rocket">রকেট</option>' : methodOpts('cash')) + '</select>') + fld('তারিখ', dateIn('xd')) + '</div>' + fld('নোট', '<input class="in" id="xn">'), { footer: '<button class="btn grow" id="xs">সেভ</button>' });
  m.q('#xs').onclick = async function () { var ok = await run(this, function () { return api('ops', { action: 'cash-entry' }, { kind: kind, amount: m.q('#xa').value, method: m.q('#xm').value, date: m.q('#xd').value, note: m.q('#xn').value }); }, 'সেভ হয়েছে'); if (ok) { m.close(); done(); } };
}
</script>
<script>
/* ═══ STAFF: list · attendance · salary ═══ */
var ST = { tab: 'list', month: '', date: '' };
PAGES.staff = async function (el) {
  ST.month = ST.month || today().slice(0, 7); ST.date = ST.date || today();
  var tabs = [['list', 'কর্মী'], ['att', 'হাজিরা']].concat(perm('salary') ? [['sal', 'বেতন']] : []);
  el.innerHTML = '<div class="tabs">' + tabs.map(function (t) { return '<div class="tab ' + (ST.tab === t[0] ? 'on' : '') + '" onclick="ST.tab=\'' + t[0] + '\';route()">' + t[1] + '</div>'; }).join('') + '</div><div id="stb"></div>';
  var b = $('#stb'); if (ST.tab === 'att') return staffAtt(b); if (ST.tab === 'sal' && perm('salary')) return staffSal(b);
  var es = await list('employees', true);
  b.innerHTML = '<div class="row sp" style="margin-bottom:10px"><div class="sm mt">কর্মী (DSR, SO, ড্রাইভার, হেল্পার…) — এঁরা অ্যাপে লগইন করেন না; আপনারা এঁদের হয়ে এন্ট্রি দেন।</div><button class="btn" onclick="empForm()">＋ নতুন</button></div><div class="card">' + (es.map(function (e) { return '<div class="li" onclick="empForm(\'' + e.id + '\')"><div class="grow"><div class="t">' + esc(e.name) + '</div><div class="s">' + esc([e.designation, e.phone].filter(Boolean).join(' · ')) + '</div></div>' + (e.salary != null ? '<div class="r b">' + tk(e.salary) + '</div>' : '') + '</div>'; }).join('') || '<div class="empty">কর্মী যোগ করুন</div>') + '</div>';
};
async function empForm(id) {
  var e = id ? byId(await list('employees'), id) : {};
  var m = modal(id ? 'কর্মী সম্পাদনা' : 'নতুন কর্মী', fld('নাম *', '<input class="in" id="en_" value="' + esc(e.name || '') + '">') + '<div class="grid g2">' + fld('পদ', '<input class="in" id="ed_" list="dl" placeholder="DSR / SO / ড্রাইভার" value="' + esc(e.designation || '') + '"><datalist id="dl"><option>DSR</option><option>SO</option><option>ড্রাইভার</option><option>হেল্পার</option><option>গোডাউন</option></datalist>') + fld('মোবাইল', '<input class="in" id="ep_" value="' + esc(e.phone || '') + '">') + '</div>' + '<div class="grid g2">' + (perm('salary') ? fld('মাসিক বেতন', '<input class="in" id="es_" type="number" min="0" inputmode="decimal" value="' + esc(e.salary || '') + '">') : '') + fld('যোগদান', '<input class="in" type="date" id="ej_" value="' + esc(e.join_date || '') + '">') + '</div>' + fld('নোট', '<input class="in" id="eno_" value="' + esc(e.note || '') + '">') + (id ? fld('অবস্থা', '<select class="in" id="ea_"><option value="true">চালু</option><option value="false"' + (e.active === false ? ' selected' : '') + '>বন্ধ</option></select>') : ''), { footer: '<button class="btn grow" id="esv_">সেভ</button>' });
  m.q('#esv_').onclick = async function () { var b = { name: m.q('#en_').value, designation: m.q('#ed_').value, phone: m.q('#ep_').value, join_date: m.q('#ej_').value || null, note: m.q('#eno_').value }; if (m.q('#es_')) b.salary = m.q('#es_').value; if (id) { b.id = id; b.active = m.q('#ea_').value === 'true'; } var ok = await run(this, function () { return api('data', { t: 'employees' }, b); }, 'সেভ হয়েছে'); if (ok) { bust(); m.close(); route(); } };
}
var ATT = { present: ['✅', 'উপস্থিত', 'gr'], absent: ['❌', 'অনুপস্থিত', 're'], late: ['⏰', 'দেরি', 'am'], leave: ['🏖', 'ছুটি', 'bl'], half: ['🌗', 'আধা দিন', 'am'] };
async function staffAtt(box) {
  var es = (await list('employees')).slice(), j = await api('ops', { action: 'attendance', month: ST.date.slice(0, 7) });
  var map = {}; j.rows.forEach(function (r) { map[r.employee_id + r.date] = r.status; });
  var cnt = function (id) { var c = {}; j.rows.forEach(function (r) { if (r.employee_id === id) c[r.status] = (c[r.status] || 0) + 1; }); return c; };
  box.innerHTML = '<div class="card">' + fld('তারিখ', dateIn('ad', ST.date)) + '<div class="row wrap sm"><button class="btn sm sec" id="aall">সবাই উপস্থিত</button></div></div><div class="card" id="alist"></div>';
  var draw = function () { $('#alist').innerHTML = es.map(function (e) { var s = map[e.id + ST.date], c = cnt(e.id);
    return '<div class="item"><div class="row sp"><b>' + esc(e.name) + '</b><span class="sm mt">এই মাসে: ' + Object.keys(c).map(function (k) { return ATT[k][0] + c[k]; }).join(' ') + '</span></div><div class="row wrap" style="margin-top:6px">' + Object.keys(ATT).map(function (k) { return '<button class="tab ' + (s === k ? 'on' : '') + '" data-e="' + e.id + '" data-s="' + k + '">' + ATT[k][0] + ' ' + ATT[k][1] + '</button>'; }).join('') + '</div></div>'; }).join('') || '<div class="empty">আগে কর্মী যোগ করুন</div>'; };
  var save = async function (rows) { var ok = await run(null, function () { return api('ops', { action: 'attendance' }, { rows: rows }); }); if (ok) { rows.forEach(function (r) { if (r.status) map[r.employee_id + r.date] = r.status; else delete map[r.employee_id + r.date]; j.rows = j.rows.filter(function (x) { return !(x.employee_id === r.employee_id && x.date === r.date); }); if (r.status) j.rows.push({ employee_id: r.employee_id, date: r.date, status: r.status }); }); draw(); } };
  $('#ad').onchange = function () { ST.date = this.value; route(); };
  $('#alist').onclick = function (e) { var b = e.target.closest('[data-s]'); if (!b) return; var id = b.getAttribute('data-e'), s = b.getAttribute('data-s'); save([{ employee_id: id, date: ST.date, status: map[id + ST.date] === s ? '' : s }]); };
  $('#aall').onclick = function () { save(es.map(function (e) { return { employee_id: e.id, date: ST.date, status: map[e.id + ST.date] || 'present' }; })); };
  draw();
}
async function staffSal(box) {
  var j = await api('ops', { action: 'salary-month', month: ST.month });
  box.innerHTML = '<div class="card">' + fld('মাস', '<input type="month" class="in" id="sm_" value="' + ST.month + '">') + '</div>' + (j.rows.map(function (r) { var pay = num(r.salary) - num(r.deduction), rem = pay - num(r.paid_salary) - num(r.advance);
    return '<div class="card"><div class="row sp"><b>' + esc(r.name) + '</b><span class="chip ' + (rem <= 0 ? '' : 'am') + '">' + (rem <= 0 ? 'পরিশোধিত' : 'বাকি ' + tk(rem)) + '</span></div><div class="sm mt">' + esc(r.designation || '') + ' · উপস্থিত ' + r.present + ' · অনুপস্থিত ' + r.absent + ' · দেরি ' + r.late + ' · ছুটি ' + r.leave + (num(r.half) ? ' · আধা ' + r.half : '') + '</div><div class="grid g4" style="margin-top:8px">' + stat('বেতন', tk(r.salary), '') + stat('কাটা', tk(r.deduction), '', 're') + stat('অগ্রিম', tk(r.advance), '', 'am') + stat('দেওয়া', tk(r.paid_salary), '', 'bl') + '</div><div class="row wrap" style="margin-top:8px"><button class="btn sm" data-p="salary" data-e="' + r.id + '" data-r="' + rem + '">বেতন দিন</button><button class="btn sm sec" data-p="advance" data-e="' + r.id + '">অগ্রিম</button><button class="btn sm sec" data-p="bonus" data-e="' + r.id + '">বোনাস</button></div></div>'; }).join('') || '<div class="empty">কর্মী নেই</div>') +
    '<div class="card"><h3>এই মাসের পরিশোধ</h3>' + (j.payments.map(function (p) { return '<div class="li"><div class="grow"><div class="t">' + esc(p.employee_name) + ' · ' + ({ salary: 'বেতন', advance: 'অগ্রিম', bonus: 'বোনাস' }[p.kind]) + '</div><div class="s">' + dfmt(p.date) + ' · ' + (METHODS[p.method] || '') + (p.note ? ' · ' + esc(p.note) : '') + '</div></div><div class="r b">' + tk(p.amount) + '</div>' + (perm('void') ? '<button class="x" data-d="' + p.id + '">🗑</button>' : '') + '</div>'; }).join('') || '<div class="empty">কিছু নেই</div>') + '</div>';
  $('#sm_').onchange = function () { ST.month = this.value; route(); };
  box.onclick = async function (e) {
    var d = e.target.closest('[data-d]'); if (d) { if (!await confirmBox('এই পরিশোধ মুছবেন?', 'মুছুন', true)) return; var ok = await run(null, function () { return api('ops', { action: 'salary-pay', id: d.getAttribute('data-d') }, null, 'DELETE'); }); if (ok) route(); return; }
    var b = e.target.closest('[data-p]'); if (!b) return; var kind = b.getAttribute('data-p'), id = b.getAttribute('data-e'), rem = num(b.getAttribute('data-r'));
    var m = modal({ salary: 'বেতন দিন', advance: 'অগ্রিম দিন', bonus: 'বোনাস দিন' }[kind], fld('টাকা *', '<input class="in" id="sa_" type="number" inputmode="decimal" min="0" value="' + (kind === 'salary' && rem > 0 ? rem : '') + '">') + '<div class="grid g2">' + fld('মাধ্যম', '<select class="in" id="sm2">' + methodOpts('cash') + '</select>') + fld('তারিখ', dateIn('sdt')) + '</div>' + fld('নোট', '<input class="in" id="sn2">'), { footer: '<button class="btn grow" id="ssv2">সেভ</button>' });
    m.q('#ssv2').onclick = async function () { var ok = await run(this, function () { return api('ops', { action: 'salary-pay' }, { employee_id: id, kind: kind, month: ST.month, amount: m.q('#sa_').value, method: m.q('#sm2').value, date: m.q('#sdt').value, note: m.q('#sn2').value }); }, 'সেভ হয়েছে'); if (ok) { m.close(); route(); } };
  };
}

/* ═══ REPORTS ═══ */
var RP = { tab: 'sum', from: '', to: '' };
var RTABS = [['sum', 'সারাংশ'], ['product', 'পণ্য'], ['shop', 'দোকান'], ['employee', 'কর্মী'], ['category', 'ক্যাটাগরি'], ['area', 'এলাকা'], ['dues', 'বাকির বয়স'], ['stock', 'স্টক'], ['pay', 'কোম্পানির পাওনা']];
PAGES.reports = async function (el) {
  RP.from = RP.from || monthStart(); RP.to = RP.to || today();
  el.innerHTML = '<div class="tabs">' + RTABS.map(function (t) { return '<div class="tab ' + (RP.tab === t[0] ? 'on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</div>'; }).join('') + '</div>' +
    '<div class="card" id="rrange"><div class="grid g2">' + fld('থেকে', dateIn('rf', RP.from)) + fld('পর্যন্ত', dateIn('rto', RP.to)) + '</div><div class="row wrap"><button class="tab" data-r="0">আজ</button><button class="tab" data-r="7">৭ দিন</button><button class="tab" data-r="m">এই মাস</button><button class="tab" data-r="pm">গত মাস</button><button class="tab" data-r="y">এই বছর</button><span class="grow"></span><button class="btn sm out" id="rcsv">⬇ CSV</button><button class="btn sm out" onclick="window.print()">🖨</button></div></div><div id="rbd">' + spin() + '</div>';
  $('.tabs', el).onclick = function (e) { var t = e.target.closest('[data-t]'); if (t) { RP.tab = t.getAttribute('data-t'); PAGES.reports(el); } };
  var noRange = ['dues', 'stock', 'pay'].indexOf(RP.tab) >= 0; $('#rrange').style.display = noRange ? 'none' : '';
  var load = function () { if (!$('#rf')) return; RP.from = $('#rf').value; RP.to = $('#rto').value; return reportBody($('#rbd')); };
  $('#rf').onchange = load; $('#rto').onchange = load;
  $$('#rrange [data-r]').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-r'), t = today(), y = +t.slice(0, 4), mo = +t.slice(5, 7);
    var f, to = t; if (k === '0') f = t; else if (k === '7') f = addDays(t, -6); else if (k === 'm') f = monthStart(); else if (k === 'pm') { var d = new Date(Date.UTC(y, mo - 2, 1)), e = new Date(Date.UTC(y, mo - 1, 0)); f = d.toISOString().slice(0, 10); to = e.toISOString().slice(0, 10); } else f = y + '-01-01';
    $('#rf').value = f; $('#rto').value = to; load(); }; });

      '<div class="card"><h3>🧰 ডেটা টুলস</h3><div class="row wrap"><button class="btn sm sec" id="bk">⬇ সম্পূর্ণ ব্যাকআপ (JSON)</button><button class="btn sm sec" id="rs">🔄 স্টক মিলিয়ে নিন</button><button class="btn sm sec" onclick="go(\'products\')">⬆ পণ্য CSV</button><button class="btn sm sec" onclick="go(\'shops\')">⬆ দোকান CSV</button></div><div class="sm mt" style="margin-top:8px">প্রতি সপ্তাহে একবার ব্যাকআপ নামিয়ে রাখুন। "স্টক মিলিয়ে নিন" স্টকের সব মুভমেন্ট যোগ করে পণ্যের স্টক ঠিক করে দেয়।</div></div>' +
      '<div class="card"><div class="row sp"><h3 style="margin:0">📜 কে কী করেছে (অডিট লগ)</h3><button class="btn sm out" id="au">দেখুন</button></div><div id="alog"></div></div>' +
      '<div class="card" style="border-color:var(--re)"><h3 class="re">🗑 রিসেট সেন্টার</h3><div class="sm mt">পরীক্ষামূলক ডেটা মুছে নতুন করে শুরু করতে। পণ্য, দোকান, কোম্পানি, কর্মী ও ইউজার মুছবে না।</div><button class="btn red sm" id="rst" style="margin-top:8px">রিসেট খুলুন</button></div>'
      : '<div class="card"><h3>🏢 ব্যবসা</h3><div>' + esc(S.set.business_name) + '</div><div class="sm mt">' + esc(S.set.business_address || '') + ' ' + esc(S.set.business_phone || '') + '</div><div class="sm mt" style="margin-top:8px">সেটিংস বদলাতে মালিকের অ্যাকাউন্ট লাগবে।</div></div>') +
    '<div class="c sm mt" style="margin:16px 0">AXIION Business Manager v6.0 · Developed by AXIION TECHNOLOGY</div>';
  if (!own) return;
  $('#setsave').onclick = async function () {
    var st = {}; $$('[data-k]', el).forEach(function (n) { st[n.getAttribute('data-k')] = n.type === 'checkbox' ? n.checked : n.value; });
    var r = await run(this, function () { return api('system', { action: 'settings' }, { settings: st }); }, 'সেটিংস সেভ হয়েছে'); if (r) { S.set = Object.assign(S.set, r.pub); drawDrawer(); }
  };
  var users = async function () { var u = (await api('auth', { action: 'users' })).users; $('#ulist').innerHTML = u.map(function (x) { return '<div class="li" data-u="' + x.id + '"><div class="grow"><div class="t">' + esc(x.name) + (x.active ? '' : ' <span class="chip re">বন্ধ</span>') + '</div><div class="s">@' + esc(x.username) + ' · ' + (x.role === 'owner' ? 'মালিক' : 'ম্যানেজার') + '</div></div><button class="btn sm out" data-r="' + x.id + '">🔑 নতুন পিন</button></div>'; }).join(''); $('#ulist').onclick = function (e) { var r = e.target.closest('[data-r]'), li = e.target.closest('[data-u]'); if (r) return resetPinFor(r.getAttribute('data-r')); if (li) userForm(u.filter(function (y) { return y.id === li.getAttribute('data-u'); })[0], users); }; };
  users(); $('#unew').onclick = function () { userForm(null, users); };
  $('#bk').onclick = async function () { var b = await run(this, function () { return api('system', { action: 'backup' }); }); if (b) download('backup_' + today() + '.json', JSON.stringify(b.backup), 'application/json'); };
  $('#rs').onclick = async function () { if (!await confirmBox('সব পণ্যের স্টক মুভমেন্ট থেকে নতুন করে হিসাব করবেন?')) return; var r = await run(this, function () { return api('system', { action: 'resync-stock' }, {}); }); if (r) { bust(); toast(r.products + 'টি পণ্যের স্টক মেলানো হয়েছে'); } };
  $('#au').onclick = async function () { var r = await run(this, function () { return api('system', { action: 'audit' }); }); if (r) $('#alog').innerHTML = '<div class="scroll" style="max-height:340px;overflow:auto;margin-top:8px"><table class="tb"><tr><th>সময়</th><th>কে</th><th>কী</th></tr>' + r.rows.map(function (x) { return '<tr><td class="sm">' + new Date(x.at).toLocaleString('en-GB', { timeZone: 'Asia/Dhaka', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) + '</td><td>' + esc(x.user_name) + '</td><td class="sm">' + esc(x.action) + ' <span class="mt">' + esc(JSON.stringify(x.detail || {}).slice(0, 80)) + '</span></td></tr>'; }).join('') + '</table></div>'; };
  $('#rst').onclick = resetCenter;
};
function userForm(u, done) {
  var m = modal(u ? 'ইউজার সম্পাদনা' : 'নতুন ইউজার', fld('নাম *', '<input class="in" id="un" value="' + esc(u ? u.name : '') + '">') + (u ? '' : fld('ইউজারনেম * (ইংরেজি)', '<input class="in" id="uu" autocapitalize="off">') + fld('শুরুর পিন * (৪–৮ সংখ্যা)', '<input class="in" id="up" inputmode="numeric" maxlength="8">')) + fld('ভূমিকা', '<select class="in" id="ur"><option value="manager">ম্যানেজার</option><option value="owner"' + (u && u.role === 'owner' ? ' selected' : '') + '>মালিক</option></select>') + (u ? fld('অবস্থা', '<select class="in" id="ua"><option value="true">চালু</option><option value="false"' + (u.active ? '' : ' selected') + '>বন্ধ (লগইন করতে পারবে না)</option></select>') : ''), { footer: '<button class="btn grow" id="us">সেভ</button>' });
  m.q('#us').onclick = async function () { var b = { name: m.q('#un').value, role: m.q('#ur').value }; if (u) { b.id = u.id; b.active = m.q('#ua').value === 'true'; } else { b.username = m.q('#uu').value; b.pin = m.q('#up').value; } var ok = await run(this, function () { return api('auth', { action: 'user-save' }, b); }, 'সেভ হয়েছে'); if (ok) { m.close(); done(); } };
}
function resetPinFor(id) {
  var m = modal('নতুন পিন দিন', fld('নতুন পিন (৪–৮ সংখ্যা)', '<input class="in" id="rp" inputmode="numeric" maxlength="8">') + '<div class="sm mt">সে পরের বার লগইনে নিজের পিন বদলে নেবে।</div>', { footer: '<button class="btn grow" id="rps">সেভ</button>' });
  m.q('#rps').onclick = async function () { var ok = await run(this, function () { return api('auth', { action: 'user-reset-pin' }, { id: id, pin: m.q('#rp').value }); }, 'পিন বদলানো হয়েছে'); if (ok) m.close(); };
}
async function resetCenter() {
  var j = await api('system', { action: 'reset-info' }), keys = Object.keys(j.info);
  var m = modal('🗑 রিসেট সেন্টার', '<div class="card" style="background:var(--rel)"><b class="re">সতর্কতা:</b> মুছে ফেলা ডেটা ফেরত আসবে না। আগে ব্যাকআপ নামিয়ে নিন।</div>' + keys.map(function (k) { return '<label class="row" style="padding:8px 0;border-bottom:1px solid var(--bd)"><input type="checkbox" data-k="' + k + '" style="width:20px;height:20px"><span class="grow">' + esc(j.info[k].label) + '</span><span class="chip gr">' + j.info[k].count + '</span></label>'; }).join('') + '<div style="margin-top:12px">' + fld('নিশ্চিত করতে <b>RESET</b> লিখুন', '<input class="in" id="rc" autocapitalize="characters">') + fld('আপনার পিন', '<input class="in" id="rpn" type="password" inputmode="numeric">') + '</div>', { footer: '<button class="btn red grow" id="rgo">মুছে ফেলুন</button>' });
  m.q('#rgo').onclick = async function () { var sel = $$('[data-k]', m.el).filter(function (n) { return n.checked; }).map(function (n) { return n.getAttribute('data-k'); }); if (!sel.length) return toast('কিছু বেছে নিন', true); var r = await run(this, function () { return api('system', { action: 'reset' }, { keys: sel, confirm: m.q('#rc').value, pin: m.q('#rpn').value }); }, 'রিসেট সম্পন্ন'); if (r) { bust(); m.close(); route(); } };
}

/* ═══ START ═══ */
window.addEventListener('keydown', function (e) { if (e.key === 'Escape' && MODALS.length) MODALS[MODALS.length - 1].close(); });
boot();
</script>
</body>
</html>
