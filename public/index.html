//  DUE CALENDAR
// ════════════════════════════════════════════════════
var CAL = { month:'', dues:[], selDate:'' };

function calMonthStr(offset) {
  var d = new Date(); d.setDate(1);
  d.setMonth(d.getMonth() + (offset||0));
  return d.toISOString().slice(0,7);
}

async function loadCal(monthStr) {
  if (!CAL.month) CAL.month = calMonthStr(0);
  if (monthStr) CAL.month = monthStr;
  showOvl('ক্যালেন্ডার লোড হচ্ছে...');
  var r = await apiGet('/api/due-calendar?month=' + CAL.month);
  hideOvl();
  if (!r.ok) return toast('লোড ব্যর্থ: ' + (r.error||''));
  CAL.dues = r.dues || [];
  renderCal();
}

function renderCal() {
  var el = document.getElementById('pg-cal');
  var canEdit = S.role === 'owner' || S.role === 'manager';
  var today = iso(new Date());
  var [yr, mo] = CAL.month.split('-').map(Number);
  var monthDate = new Date(yr, mo-1, 1);
  var monthName = monthDate.toLocaleDateString('bn-BD', {year:'numeric', month:'long'});
  var daysInMonth = new Date(yr, mo, 0).getDate();
  var firstDay = new Date(yr, mo-1, 1).getDay();

  var dueMap = {};
  CAL.dues.forEach(function(d) {
    if (!dueMap[d.dueDate]) dueMap[d.dueDate] = [];
    dueMap[d.dueDate].push(d);
  });

  var totalPending = CAL.dues.filter(function(d){return d.status==='pending';}).reduce(function(s,d){return s+num(d.amount)-num(d.paidAmount);},0);
  var totalPartial  = CAL.dues.filter(function(d){return d.status==='partial';}).reduce(function(s,d){return s+num(d.paidAmount);},0);
  var totalCleared  = CAL.dues.filter(function(d){return d.status==='cleared';}).reduce(function(s,d){return s+num(d.amount);},0);

  var maxDayAmt = 0;
  Object.keys(dueMap).forEach(function(date){
    var dayAmt = dueMap[date].reduce(function(s,d){return s+num(d.amount)-num(d.paidAmount);},0);
    if (dayAmt > maxDayAmt) maxDayAmt = dayAmt;
  });

  var h = '';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">';
  h += '<button class="btn btn-gh btn-sm" onclick="loadCal(prevCalMonth())">◀ আগের মাস</button>';
  h += '<div style="font-size:15px;font-weight:700;color:var(--bl)">📅 '+monthName+'</div>';
  h += '<button class="btn btn-gh btn-sm" onclick="loadCal(nextCalMonth())">পরের মাস ▶</button>';
  h += '</div>';

  h += '<div class="mets" style="grid-template-columns:1fr 1fr 1fr 1fr;margin-bottom:12px">';
  h += '<div class="met"><div class="ml">বকেয়া</div><div class="mv" style="color:var(--re);font-size:14px">৳'+fm(totalPending)+'</div></div>';
  h += '<div class="met"><div class="ml">আংশিক</div><div class="mv" style="color:#FF9800;font-size:14px">৳'+fm(totalPartial)+'</div></div>';
  h += '<div class="met"><div class="ml">পরিশোধিত</div><div class="mv" style="color:var(--gr);font-size:14px">৳'+fm(totalCleared)+'</div></div>';
  h += '<div class="met"><div class="ml">এন্ট্রি</div><div class="mv" style="font-size:14px">'+CAL.dues.length+'টি</div></div>';
  h += '</div>';

  h += '<div class="cal-legend">';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--rel);border:1.5px solid var(--re)"></div> বকেয়া</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:#FFF3E0;border:1.5px solid #FF9800"></div> আংশিক</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:var(--grl);border:1.5px solid var(--gr)"></div> পরিশোধিত</div>';
  h += '<div class="cal-leg-item"><div class="cal-leg-dot" style="background:#FFF8E1;border:1.5px solid var(--am)"></div> মিশ্র</div>';
  h += '</div>';

  // ── Per-person monthly due summary ─────────────────────────
  var personMap = {};
  CAL.dues.forEach(function(d) {
    var key = d.dsrName || '—';
    if (!personMap[key]) personMap[key] = { name: key, clientType: d.clientType || 'dsr', total: 0, remaining: 0 };
    personMap[key].total     += num(d.amount);
    personMap[key].remaining += Math.max(0, num(d.amount) - num(d.paidAmount));
  });
  var personList = Object.values(personMap).filter(function(p){ return p.total > 0; });
  if (personList.length) {
    h += '<div class="ct">👤 ব্যক্তিভিত্তিক মাসিক বাকি সারাংশ</div>';
    h += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">';
    personList.forEach(function(p) {
      var badge = p.clientType === 'custom'
        ? '<span style="font-size:10px;background:#EDE7F6;color:#673AB7;border-radius:4px;padding:1px 5px;margin-left:4px">কাস্টম</span>'
        : '<span style="font-size:10px;background:#E3F2FD;color:var(--bl);border-radius:4px;padding:1px 5px;margin-left:4px">DSR</span>';
      var remColor = p.remaining > 0 ? 'var(--re)' : 'var(--gr)';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid #EEF2FF">';
      h += '<div><span style="font-weight:700;font-size:13px">'+esc(p.name)+'</span>'+badge+'</div>';
      h += '<div style="text-align:right"><div style="font-size:13px;font-weight:700;color:'+remColor+'">৳'+fm(p.remaining)+'</div>';
      h += '<div style="font-size:10px;color:var(--mt2)">মোট: ৳'+fm(p.total)+'</div></div>';
      h += '</div>';
    });
    h += '</div>';
  }

  h += '<div class="card" style="padding:10px;margin-bottom:10px">';
  h += '<div class="cal-grid">';
  var dayLabels = ['রবি','সোম','মঙ্গ','বুধ','বৃহ','শুক্র','শনি'];
  dayLabels.forEach(function(d){ h += '<div class="cal-day-hdr">'+d+'</div>'; });

  for (var i=0; i<firstDay; i++) h += '<div class="cal-cell empty"></div>';

  for (var day=1; day<=daysInMonth; day++) {
    var mm = String(mo).padStart(2,'0'), dd = String(day).padStart(2,'0');
    var dateStr = yr+'-'+mm+'-'+dd;
    var dayDues  = dueMap[dateStr] || [];
    var hasDue   = dayDues.length > 0;
    var allPaid    = hasDue && dayDues.every(function(d){return d.status==='cleared';});
    var allPending = hasDue && dayDues.every(function(d){return d.status==='pending';});
    var hasPartial = hasDue && dayDues.some(function(d){return d.status==='partial';});
    var isTdy    = dateStr === today;
    var dayRemaining = dayDues.reduce(function(s,d){return s+num(d.amount)-num(d.paidAmount);},0);
    var heatRatio = maxDayAmt > 0 ? dayRemaining/maxDayAmt : 0;
    var isHeavy = heatRatio >= 0.6;

    var cls = 'cal-cell';
    if (isTdy) cls += ' today-cell';
    if (hasDue && allPaid) cls += ' has-due all-paid';
    else if (hasDue && hasPartial && !allPaid) cls += ' has-due partial';
    else if (hasDue && allPending) cls += ' has-due';
    else if (hasDue) cls += ' has-due mixed';
    if (hasDue && isHeavy && !allPaid) cls += ' due-heavy';

    var dotHtml = '';
    if (hasDue) {
      if (allPaid)         dotHtml = '<div class="cal-dot cal-dot-gr"></div>';
      else if (hasPartial) dotHtml = '<div class="cal-dot cal-dot-or"></div>';
      else if (allPending) dotHtml = '<div class="cal-dot cal-dot-re"></div>';
      else                 dotHtml = '<div class="cal-dot cal-dot-am"></div>';
    }

    h += '<div class="'+cls+'" onclick="calDayClick(\''+dateStr+'\')">';
    h += '<div class="cal-day-num" style="color:'+(isTdy?'var(--bl)':'var(--txt)')+'">'+(isTdy?'<strong>'+day+'</strong>':day)+'</div>';
    h += dotHtml;
    if (hasDue) {
      h += '<div style="font-size:7.5px;color:var(--mt);margin-top:1px">'+dayDues.length+'টি</div>';
      if (!allPaid && dayRemaining > 0) h += '<div class="cal-amt-badge">৳'+fm(dayRemaining)+'</div>';
    }
    h += '</div>';
  }
  h += '</div></div>';

  if (canEdit) {
    h += '<button class="btn btn-bl btn-w" onclick="calAddModal(\'\')">➕ নতুন বাকি যোগ করুন</button>';
    h += '<div style="height:10px"></div>';
  }

  if (CAL.dues.length) {
    h += '<div class="ct">📋 এই মাসের সব এন্ট্রি</div>';
    h += '<div class="card" style="padding:0;overflow:hidden">';
    CAL.dues.slice().sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);}).forEach(function(d){
      var isPending = d.status === 'pending';
      var isPartial = d.status === 'partial';
      var isCleared = d.status === 'cleared';
      var paid      = num(d.paidAmount);
      var total     = num(d.amount);
      var remaining = total - paid;
      var pct       = total > 0 ? Math.round(paid/total*100) : 0;
      var statusCls = isPending ? 'status-pending' : (isPartial ? 'status-partial' : 'status-cleared');
      var statusLbl = isPending ? '🔴 বকেয়া' : (isPartial ? '🟠 আংশিক পরিশোধ' : '🟢 পরিশোধিত');

      h += '<div class="due-item">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-weight:700;font-size:13px">'+fmtBn(d.dueDate)+'</div>';
      h += '<div style="font-size:11px;color:var(--mt)">'+(d.dsrName||'—')+(d.note?' · '+esc(d.note):'')+'</div>';
      if (d.shopName) h += '<div style="font-size:11px;color:#673AB7;font-weight:600">🏪 '+esc(d.shopName)+'</div>';
      h += '<div class="'+statusCls+'">'+statusLbl+'</div>';
      if (isPartial) {
        h += '<div class="pay-prog-bar"><div class="pay-prog-fill" style="width:'+pct+'%"></div></div>';
        h += '<div style="font-size:10px;color:var(--mt)">পরিশোধ: ৳'+fm(paid)+' / বাকি: ৳'+fm(remaining)+'</div>';
      }
      h += '</div>';
      h += '<div style="text-align:right;min-width:90px;margin-left:8px">';
      h += '<div style="font-size:15px;font-weight:700;color:'+(isCleared?'var(--gr)':(isPartial?'#FF9800':'var(--re))'))+'">৳'+fm(total)+'</div>';
      if (canEdit) {
        if (!isCleared) {
          h += '<button class="btn btn-sm" style="background:var(--grl);color:var(--gr);margin-top:4px" onclick="calPayModal(\''+d.id+'\')">💳 পরিশোধ</button>';
        } else {
          h += '<button class="btn btn-sm btn-gh" style="margin-top:4px" onclick="calUndo(\''+d.id+'\')">↩️ পূর্বাবস্থা</button>';
        }
      }
      h += '</div></div>';
    });
    h += '</div>';
  }

  h += '<div style="text-align:center;font-size:10px;color:var(--mt2);padding:8px">Miron Electronics · Powered by <span style="color:#FFD700;font-weight:700">AXIION</span></div>';
  el.innerHTML = h;
}

function prevCalMonth() {
  var [yr,mo] = CAL.month.split('-').map(Number);
  mo--; if(mo<1){mo=12;yr--;}
  return yr+'-'+String(mo).padStart(2,'0');
}
function nextCalMonth() {
  var [yr,mo] = CAL.month.split('-').map(Number);
  mo++; if(mo>12){mo=1;yr++;}
  return yr+'-'+String(mo).padStart(2,'0');
}

// ── Level 1: show people list for a date ─────────────────────
function calDayClick(dateStr) {
  var dayDues = CAL.dues.filter(function(d){return d.dueDate===dateStr;});
  var canEdit  = S.role==='owner'||S.role==='manager';
  var modal = document.createElement('div');
  modal.id = 'cal-day-modal';
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){if(e.target===modal)document.body.removeChild(modal);};
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title">📅 '+fmtBn(dateStr)+'</div>';
  if (!dayDues.length) {
    h += '<div style="text-align:center;color:var(--mt2);padding:20px 0">এই দিনে কোনো বাকি নেই</div>';
    if (canEdit) h += '<button class="btn btn-bl btn-w" onclick="document.body.removeChild(document.getElementById(\'cal-day-modal\'));calAddModal(\''+dateStr+'\')">➕ এই দিনে বাকি যোগ করুন</button>';
  } else {
    // Build per-person summary
    var pMap = {};
    dayDues.forEach(function(d){
      var pKey = d.dsrName||'—';
      if (!pMap[pKey]) pMap[pKey] = { name: pKey, clientType: d.clientType||'dsr', dues:[], total:0, remaining:0 };
      pMap[pKey].dues.push(d);
      pMap[pKey].total     += num(d.amount);
      pMap[pKey].remaining += Math.max(0, num(d.amount)-num(d.paidAmount));
    });
    var people = Object.values(pMap);
    h += '<div style="font-size:11px;color:var(--mt2);margin-bottom:10px;text-align:center">নামে ট্যাপ করুন বিস্তারিত দেখতে</div>';
    people.forEach(function(p){
      var allCleared = p.dues.every(function(d){return d.status==='cleared';});
      var hasPartial = p.dues.some(function(d){return d.status==='partial';});
      var dotColor   = allCleared ? 'var(--gr)' : (hasPartial ? '#FF9800' : 'var(--re)');
      var remTxt     = p.remaining > 0 ? '৳'+fm(p.remaining)+' বাকি' : '✅ পরিশোধিত';
      var badge = p.clientType==='custom'
        ? '<span style="font-size:10px;background:#EDE7F6;color:#673AB7;border-radius:4px;padding:1px 5px;margin-left:4px">কাস্টম</span>'
        : '<span style="font-size:10px;background:#E3F2FD;color:var(--bl);border-radius:4px;padding:1px 5px;margin-left:4px">DSR</span>';
      var safeKey = encodeURIComponent(p.name);
      h += '<div class="due-item" style="cursor:pointer;border-radius:10px;background:#F8F9FA;margin-bottom:6px;padding:10px 12px;align-items:center" onclick="calPersonDayDetail(\''+dateStr+'\',decodeURIComponent(\''+safeKey+'\'))">';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="font-weight:700;font-size:14px">'+esc(p.name)+badge+'</div>';
      h += '<div style="font-size:11px;color:var(--mt);margin-top:2px">'+p.dues.length+'টি লেনদেন · মোট: ৳'+fm(p.total)+'</div>';
      h += '</div>';
      h += '<div style="text-align:right;margin-left:10px">';
      h += '<div style="font-size:14px;font-weight:700;color:'+dotColor+'">'+remTxt+'</div>';
      h += '<div style="font-size:11px;color:var(--mt2);margin-top:2px">বিস্তারিত ▶</div>';
      h += '</div></div>';
    });
    if (canEdit) h += '<div style="margin-top:8px"><button class="btn btn-bl btn-w" onclick="document.body.removeChild(document.getElementById(\'cal-day-modal\'));calAddModal(\''+dateStr+'\')">➕ আরো যোগ করুন</button></div>';
  }
  h += '<div style="margin-top:12px"><button class="btn btn-gh btn-w" onclick="document.body.removeChild(document.getElementById(\'cal-day-modal\'))">বন্ধ করুন</button></div>';
  h += '</div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
}

// ── Level 2: show one person's transactions for a date ────────
function calPersonDayDetail(dateStr, personName) {
  var dayDues = CAL.dues.filter(function(d){return d.dueDate===dateStr && (d.dsrName||'—')===personName;});
  var canEdit  = S.role==='owner'||S.role==='manager';
  // close level-1 modal
  var prev = document.getElementById('cal-day-modal');
  if (prev) document.body.removeChild(prev);
  var modal = document.createElement('div');
  modal.id = 'cal-person-modal';
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){if(e.target===modal)document.body.removeChild(modal);};
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title" style="font-size:14px">'+esc(personName)+'<div style="font-size:11px;color:var(--mt);font-weight:400;margin-top:2px">📅 '+fmtBn(dateStr)+'</div></div>';
  dayDues.forEach(function(d){
    var isPending = d.status==='pending';
    var isPartial = d.status==='partial';
    var isCleared = d.status==='cleared';
    var paid      = num(d.paidAmount);
    var total     = num(d.amount);
    var remaining = total - paid;
    var pct       = total > 0 ? Math.round(paid/total*100) : 0;
    var statusCls = isPending?'status-pending':(isPartial?'status-partial':'status-cleared');
    var statusLbl = isPending?'🔴 বকেয়া':(isPartial?'🟠 আংশিক পরিশোধ':'🟢 পরিশোধিত');
    h += '<div class="due-item" style="margin-bottom:8px;border:1px solid #EEF2FF;border-radius:10px;padding:10px">';
    h += '<div style="flex:1;min-width:0">';
    if (d.shopName) h += '<div style="font-size:11px;color:#673AB7;font-weight:600;margin-bottom:3px">🏪 '+esc(d.shopName)+'</div>';
    if (d.note) h += '<div style="font-size:11px;color:var(--mt);margin-bottom:3px">📝 '+esc(d.note)+'</div>';
    h += '<div class="'+statusCls+'">'+statusLbl+'</div>';
    if (isPartial) {
      h += '<div class="pay-prog-bar" style="margin-top:5px"><div class="pay-prog-fill" style="width:'+pct+'%"></div></div>';
      h += '<div style="font-size:10px;color:var(--mt);margin-top:2px">পরিশোধ: ৳'+fm(paid)+' · বাকি: ৳'+fm(remaining)+'</div>';
    }
    h += '</div>';
    h += '<div style="text-align:right;margin-left:8px;min-width:80px">';
    h += '<div style="font-size:16px;font-weight:700;color:'+(isCleared?'var(--gr)':(isPartial?'#FF9800':'var(--re)'))+'">\৳'+fm(total)+'</div>';
    if (canEdit) {
      if (!isCleared) {
        h += '<button class="btn btn-sm" style="background:var(--grl);color:var(--gr);margin-top:4px" onclick="document.body.removeChild(document.getElementById(\'cal-person-modal\'));calPayModal(\''+d.id+'\')">💳 পরিশোধ</button>';
      } else {
        h += '<button class="btn btn-sm btn-gh" style="margin-top:4px" onclick="document.body.removeChild(document.getElementById(\'cal-person-modal\'));calUndo(\''+d.id+'\')">↩️ পূর্বাবস্থা</button>';
      }
    }
    h += '</div></div>';
  });
  var safeDate = encodeURIComponent(dateStr);
  h += '<div style="margin-top:12px;display:flex;gap:8px">';
  h += '<button class="btn btn-gh" style="flex:1" onclick="document.body.removeChild(document.getElementById(\'cal-person-modal\'));calDayClick(decodeURIComponent(\''+safeDate+'\'))">◀ ফিরে যান</button>';
  h += '<button class="btn btn-gh" onclick="document.body.removeChild(document.getElementById(\'cal-person-modal\'))">বন্ধ</button>';
  h += '</div>';
  h += '</div>';
  modal.innerHTML = h;
  document.body.appendChild(modal);
}

  var paid      = num(due.paidAmount);

  var modal = document.createElement('div');
  modal.className = 'due-modal-bg';
  modal.onclick = function(e){if(e.target===modal)document.body.removeChild(modal);};
  var h = '<div class="due-modal">';
  h += '<div class="due-modal-title">💳 পরিশোধ করুন</div>';
  h += '<div style="background:#F8F9FA;border-radius:10px;padding:10px;margin-bottom:14px">';
  h += '<div style="font-size:13px;font-weight:700">'+(due.dsrName||'—')+'</div>';
  h += '<div style="font-size:12px;color:var(--mt)">'+fmtBn(due.dueDate)+(due.note?' · '+esc(due.note):'')+'</div>';
  h += '<div style="margin-top:6px;display:flex;gap:16px">';
  h += '<div><div style="font-size:10px;color:var(--mt)">মোট বাকি</div><div style="font-weight:700;color:var(--re)">৳'+fm(total)+'</div></div>';
  h += '<div><div style="font-size:10px;color:var(--mt)">পরিশোধিত</div><div style="font-weight:700;color:var(--gr)">৳'+fm(paid)+'</div></div>';
  h += '<div><div style="font-size:10px;color:var(--mt)">অবশিষ্ট</div><div style="font-weight:700;color:#FF9800">৳'+fm(remaining)+'</div></div>';

  h += '<button class="btn btn-sm btn-gh" onclick="document.getElementById(\'pay-amt\').value='+Number((remaining/2).toFixed(3))+'">৫০%</button>';
  h += '<button class="btn btn-sm btn-gh" onclick="document.getElementById(\'pay-amt\').value='+Number((remaining*3/4).toFixed(3))+'">৭৫%</button>';
  h += '<button class="btn btn-sm" style="background:var(--grl);color:var(--gr)" onclick="document.getElementById(\'pay-amt\').value='+remaining+'">সম্পূর্ণ</button>';
  h += '</div>';
  h += '<div class="fg"><label class="fl">🔐 Owner পাসওয়ার্ড *</label>';
  h += '<input type="password" id="pay-pin" placeholder="PIN দিন" maxlength="10" inputmode="numeric"></div>';
  h += '<div style="display:flex;gap:8px;margin-top:4px">';
  h += '<button class="btn btn-bl" style="flex:1" onclick="calDoPayment(\''+id+'\','+remaining+')">✅ নিশ্চিত করুন</button>';

async function calDoPayment(id, maxRemaining) {
  var payAmt = parseFloat(document.getElementById('pay-amt').value);
  var pin    = document.getElementById('pay-pin').value.trim();
  if (!payAmt || payAmt <= 0) return toast('পরিমাণ দিন');
  if (payAmt > maxRemaining + 0.01) return toast('পরিমাণ অবশিষ্ট বাকির বেশি হতে পারবে না');
  if (!pin) return toast('Owner পাসওয়ার্ড দিন');
  // Validate owner password via API (works even after password change)
  showOvl('পাসওয়ার্ড যাচাই হচ্ছে...');
  var authR = await apiPost('/api/auth', { password: pin });
  hideOvl();
  if (!authR || !authR.ok) return toast('❌ পাসওয়ার্ড ভুল');
  if (authR.role !== 'owner') return toast('❌ শুধুমাত্র Owner পাসওয়ার্ড গ্রহণযোগ্য');
  var modal = document.querySelector('.due-modal-bg');
  if (modal) document.body.removeChild(modal);
  showOvl('পরিশোধ হচ্ছে...');
  var r = await apiPut('/api/due-calendar', {id:id, payAmount:payAmt});
  hideOvl();
  if (r.ok) {
    var msg = r.status==='cleared' ? '🟢 সম্পূর্ণ পরিশোধিত!' : '🟠 আংশিক পরিশোধ · অবশিষ্ট: ৳'+fm(r.remaining);
    toast(msg);
    loadCal(CAL.month);
  } else toast(r.error||'ব্যর্থ');
}

async function calSaveNew() {
  var clientType = v('cal-client-type') || 'dsr';
  var dsrId = '', dsrName = '';
  if (clientType === 'custom') {
    dsrName = v('cal-custom-nm').trim();
    if (!dsrName) return toast('কাস্টমার নাম দিন');
  } else {
    var srVal = v('cal-sr');
    if (srVal) { var pts=srVal.split('|'); dsrId=pts[0]; dsrName=pts.slice(1).join('|'); }
  }
  var shopName = v('cal-shop').trim();
  var dueDate  = v('cal-dt');
  var amount   = vn('cal-am');
  var note     = v('cal-nt');
  if (!dueDate) return toast('তারিখ দিন');
  if (!amount)  return toast('পরিমাণ দিন');
  var modal = document.querySelector('.due-modal-bg');
  if (modal) document.body.removeChild(modal);
  showOvl('সংরক্ষণ হচ্ছে...');
  var r = await apiPost('/api/due-calendar', {dsrId:dsrId, dsrName:dsrName, clientType:clientType, shopName:shopName, dueDate:dueDate, amount:amount, note:note});

  if (r.ok) { toast('✅ বাকি এন্ট্রি যোগ হয়েছে'); loadCal(CAL.month); }
  else toast(r.error||'ব্যর্থ');
}

async function calUndo(id) {

  showOvl('আপডেট হচ্ছে...');

// ════════════════════════════════════════════════════
//  GROUP CHAT
// ════════════════════════════════════════════════════
var _gcMsgs        = [];
var _gcSubClient   = null;
var _gcChannel     = null;
var _gcLive        = false;
var _gcSending     = false;
var _gcInited      = false;
var _gcPollTimer   = null;

var ROLE_LABELS_CHAT = { owner:'Owner', manager:'Manager', so:'SO', dsr:'DSR' };

function _gcRoleClass(role) {
  if (role==='owner')   return 'gc-role-owner';
  if (role==='manager') return 'gc-role-manager';
  if (role==='so')      return 'gc-role-so';
  return 'gc-role-dsr';
}

function _gcFmtTime(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    var h = d.getHours(), m = d.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  } catch(e) { return ''; }
}

function _gcFmtDate(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    var months = ['জানু','ফেব্রু','মার্চ','এপ্রি','মে','জুন','জুলা','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
    return d.getDate()+' '+months[d.getMonth()];
  } catch(e) { return iso.slice(0,10); }
}

function _gcDateKey(iso) { return iso ? String(iso).slice(0,10) : ''; }

function _gcBuildMsgHTML(msg, showDate) {
  var isMine = (msg.senderId === S.userId) ||
               (msg.senderRole === 'owner' && S.role === 'owner' && !msg.senderId);
  var cls = isMine ? 'mine' : 'other';
  var roleLabel = ROLE_LABELS_CHAT[msg.senderRole] || msg.senderRole;
  var roleCls   = _gcRoleClass(msg.senderRole);
  var h = '';
  if (showDate) {
    h += '<div class="gc-date-sep">'+_gcFmtDate(msg.createdAt)+'</div>';
  }
  h += '<div class="gc-msg '+cls+'" data-id="'+esc(msg.id)+'">';
  if (!isMine) {
    h += '<div class="gc-meta">';
    h += '<span style="font-weight:700">'+esc(msg.senderName)+'</span>';
    h += '<span class="gc-role-badge '+roleCls+'">'+esc(roleLabel)+'</span>';
    h += '</div>';
  }
  h += '<div class="gc-bubble">'+esc(msg.message).replace(/\n/g,'<br>')+'</div>';
  h += '<div class="gc-time">'+_gcFmtTime(msg.createdAt)+(isMine?' ✓':'')+'</div>';
  h += '</div>';
  return h;
}

function _gcRenderMessages() {
  var el = document.getElementById('gc-msgs-list');
  if (!el) return;
  if (!_gcMsgs.length) {
    el.innerHTML = '<div class="gc-empty"><div style="font-size:36px">💬</div><div>এখনো কোনো বার্তা নেই।<br>প্রথম বার্তাটি পাঠান!</div></div>';
    return;
  }
  var h = '';
  var lastDate = '';
  _gcMsgs.forEach(function(msg) {
    var dk = _gcDateKey(msg.createdAt);
    var showDate = dk !== lastDate;
    lastDate = dk;
    h += _gcBuildMsgHTML(msg, showDate);
  });
  el.innerHTML = h;
}

function _gcAppendMsg(msg) {
  var el = document.getElementById('gc-msgs-list');
  if (!el) return;
  // Remove empty state
  var empty = el.querySelector('.gc-empty');
  if (empty) el.innerHTML = '';
  // Date separator check
  var lastDate = '';
  if (_gcMsgs.length > 0) lastDate = _gcDateKey(_gcMsgs[_gcMsgs.length-1].createdAt);
  var dk = _gcDateKey(msg.createdAt);
  var showDate = dk !== lastDate;
  el.insertAdjacentHTML('beforeend', _gcBuildMsgHTML(msg, showDate));
  _gcScrollBottom();
}

function _gcScrollBottom() {
  var el = document.getElementById('gc-msgs-list');
  if (el) setTimeout(function(){ el.scrollTop = el.scrollHeight; }, 50);
}

function _gcSetLive(live) {
  _gcLive = live;
  var dot = document.getElementById('gc-conn-dot');
  if (dot) {
    dot.className = 'gc-conn-dot' + (live?' live':'');
    dot.title = live ? 'সরাসরি সংযুক্ত' : 'পোলিং মোড';
  }
}

async function _gcInitRealtime() {
  try {
    var cfg = await apiGet('/api/expenses?action=chat-config');
    if (!cfg || !cfg.ok || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      _gcStartPolling(); return;
    }
    if (typeof window.supabase === 'undefined') { _gcStartPolling(); return; }
    _gcSubClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    _gcChannel = _gcSubClient.channel('gc-global')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'group_chat_messages' },
        function(payload) {
          var raw = payload.new;
          if (!raw) return;
          // Dedup
          if (_gcMsgs.find(function(m){ return m.id === String(raw.id||''); })) return;
          var msg = { id:String(raw.id||''), senderId:String(raw.sender_id||''),
            senderName:raw.sender_name||'', senderRole:raw.sender_role||'',
            message:raw.message||'', createdAt:raw.created_at||'' };
          _gcMsgs.push(msg);
          _gcAppendMsg(msg);
        })
      .subscribe(function(status) {
        if (status === 'SUBSCRIBED') _gcSetLive(true);
        else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
          _gcSetLive(false); _gcStartPolling();
        }
      });
  } catch(e) { _gcStartPolling(); }
}

function _gcStartPolling() {
  if (_gcPollTimer) return;
  _gcPollTimer = setInterval(async function() {
    if (_extraTab !== 'groupchat' && S.tab !== 'chat') return;
    var lastId = _gcMsgs.length ? _gcMsgs[_gcMsgs.length-1].createdAt : '';
    var r = await apiGet('/api/expenses?action=chat-msgs');
    if (!r || !r.ok) return;
    var newMsgs = (r.messages||[]).filter(function(m){
      return !_gcMsgs.find(function(x){ return x.id===m.id; });
    });
    newMsgs.forEach(function(m){ _gcMsgs.push(m); _gcAppendMsg(m); });
  }, 4000);
}

async function gcLoadAndInit() {
  if (_gcInited) { _gcScrollBottom(); return; }
  _gcInited = true;
  var r;
  try {
    var _tout = new Promise(function(res){ setTimeout(function(){ res({ok:false,error:'timeout'}); }, 12000); });
    r = await Promise.race([apiGet('/api/expenses?action=chat-msgs'), _tout]);
  } catch(e) { r = {ok:false,error:e.message}; }
  if (!r || !r.ok) {
    var _el = document.getElementById('gc-msgs-list');
    if (_el) _el.innerHTML = '<div class="gc-empty"><div style="font-size:32px">⚠️</div><div style="margin-top:8px;color:var(--mt)">লোড ব্যর্থ হয়েছে</div><button class="btn btn-bl" style="margin-top:12px;font-size:12px" ontouchstart="event.preventDefault();_gcInited=false;gcLoadAndInit()" onclick="_gcInited=false;gcLoadAndInit()">🔄 পুনরায় চেষ্টা করুন</button></div>';
    return;
  }
  _gcMsgs = r.messages || [];
  _gcRenderMessages();
  _gcScrollBottom();
  _gcInitRealtime();
}

async function gcSend() {
  if (_gcSending) return;
  var ta = document.getElementById('gc-input-ta');
  if (!ta) return;
  var msg = ta.value.trim();
  if (!msg) return;
  _gcSending = true;
  var btn = document.getElementById('gc-send-btn');
  if (btn) btn.disabled = true;
  var r = await apiPost('/api/expenses?action=chat-send', {
    senderId:   S.userId,
    senderName: S.userName || (S.role==='owner'?'Owner':'Manager'),
    senderRole: S.role,
    message:    msg
  });
  _gcSending = false;
  if (btn) btn.disabled = false;
  if (r && r.ok) {
    ta.value = '';
    ta.style.height = '';
    // Optimistic: if realtime is live it'll arrive; otherwise poll will pick it up
    // But add optimistically for immediate feedback
    if (!_gcLive) {
      var optMsg = { id:'opt-'+Date.now(), senderId:S.userId,
        senderName: S.userName||(S.role==='owner'?'Owner':''), senderRole:S.role,
        message:msg, createdAt:new Date().toISOString() };
      _gcMsgs.push(optMsg);
      _gcAppendMsg(optMsg);
    }
  } else {
    toast((r&&r.error)||'পাঠানো ব্যর্থ');
  }
}

function gcInputKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); gcSend(); }
  // Auto-resize
  var ta = e.target;
  ta.style.height='auto';
  ta.style.height=Math.min(ta.scrollHeight,90)+'px';
}
</script>
