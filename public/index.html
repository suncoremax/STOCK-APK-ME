<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D47A1">
<title>Miron Electronics — স্টক ম্যানেজমেন্ট v7</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bl:#0D47A1;--bl2:#1565C0;--bll:#E3F2FD;
  --gr:#2E7D32;--grl:#E8F5E9;
  --re:#C62828;--rel:#FFEBEE;
  --am:#E65100;--aml:#FFF3E0;
  --te:#00695C;--tel:#E0F2F1;
  --pu:#6A1B9A;--pul:#F3E5F5;
  --go:#F57F17;--gol:#FFF8E1;
  --bg:#EEF2FF;--card:#fff;--bdr:#C5CAE9;
  --txt:#0D1B2A;--mt:#546E7A;--mt2:#90A4AE;
  --rad:12px;--shad:0 2px 8px rgba(13,71,161,.1);
  --inp-bg:#fff;--nav-bg:#fff;--seg-bg:#E8EAF6;
  --hdr1:#0D2137;--hdr2:#0D47A1;
}
body.dark{
  --bg:#0F1923;--card:#1A2535;--bdr:#2A3A50;
  --txt:#E8EDF5;--mt:#8CA0B8;--mt2:#506070;
  --shad:0 2px 8px rgba(0,0,0,.35);
  --bll:#0D2547;--grl:#0D2515;--rel:#2A1015;
  --aml:#2A1800;--tel:#0A2020;--pul:#1E0D30;--gol:#2A1F00;
  --inp-bg:#1A2535;--nav-bg:#111D2B;--seg-bg:#1E2D40;
  --hdr1:#060E18;--hdr2:#0A2D6E;
}
/* Theme toggle button */
.theme-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 9px;font-size:14px;cursor:pointer;line-height:1;font-family:inherit;transition:.15s}
.theme-btn:active{transform:scale(.93)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--txt);font-size:14px;display:flex;flex-direction:column}

/* SPLASH */
#spl{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(145deg,#0D2137,#0D47A1);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
#spl.fade{opacity:0;pointer-events:none}
.sl-logo{width:90px;height:90px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);font-size:44px}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.sl-nm{color:#fff;font-size:28px;font-weight:700;animation:up .5s .25s both;letter-spacing:3px}
.sl-sb{color:rgba(255,255,255,.65);font-size:12px;margin-top:4px;animation:up .5s .4s both}
.sl-dev{color:rgba(255,215,0,.9);font-size:13px;font-weight:700;margin-top:18px;animation:up .5s .55s both;letter-spacing:2px}
.sl-bar{margin-top:10px;width:160px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;animation:up .5s .6s both}
.sl-prog{height:100%;background:#FFD700;border-radius:2px;animation:prog 2s ease forwards}
@keyframes prog{from{width:0}to{width:100%}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* LAYOUT */
#app{flex:1;display:flex;flex-direction:column;overflow:hidden;opacity:0;transition:opacity .3s}
#app.show{opacity:1}
.hdr{background:linear-gradient(90deg,var(--hdr1),var(--hdr2));color:#fff;padding:11px 14px 9px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
.hdr h1{font-size:15px;font-weight:700;line-height:1}
.hdr-s{font-size:10px;opacity:.75;margin-top:2px}
.pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:12px 12px 72px;max-width:640px;margin:0 auto;display:none}
.page.active{display:block}
.nav{flex-shrink:0;background:var(--nav-bg);border-top:1px solid var(--bdr);display:flex;height:56px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nb{flex:1;min-width:44px;max-width:14.28%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:none;font-size:7px;color:var(--mt2);cursor:pointer;padding:3px 1px;font-family:'Hind Siliguri',sans-serif;transition:.15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.nb.active{color:var(--bl)}.ni{font-size:18px;line-height:1}

.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--shad);padding:12px;margin-bottom:10px;border:1px solid var(--bdr)}
.ct{font-size:13px;font-weight:700;color:var(--bl);margin-bottom:10px}

.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.met{background:var(--card);border-radius:10px;padding:11px;text-align:center;border:1px solid var(--bdr);box-shadow:var(--shad)}
.mv{font-size:18px;font-weight:700;margin:3px 0 1px;line-height:1}
.ml{font-size:10px;color:var(--mt2)}
.met-b{border-top:3px solid var(--bl)}.met-g{border-top:3px solid var(--gr)}
.met-r{border-top:3px solid var(--re)}.met-a{border-top:3px solid var(--am)}

.fl{display:block;font-size:11px;color:var(--mt);margin-bottom:3px;font-weight:600}
input,select,textarea{width:100%;border:1.5px solid var(--bdr);border-radius:7px;padding:8px 11px;font-size:13px;font-family:'Hind Siliguri',sans-serif;color:var(--txt);background:var(--inp-bg);outline:none;transition:.12s}
input:focus,select:focus{border-color:var(--bl);box-shadow:0 0 0 2px rgba(13,71,161,.1)}
.fg{margin-bottom:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 14px;border-radius:7px;border:none;font-size:13px;font-family:'Hind Siliguri',sans-serif;font-weight:700;cursor:pointer;transition:.12s}
.btn:active{transform:scale(.97)}
.btn-bl{background:var(--bl);color:#fff}.btn-gr{background:var(--gr);color:#fff}
.btn-re{background:var(--re);color:#fff}.btn-am{background:var(--am);color:#fff}
.btn-te{background:var(--te);color:#fff}.btn-pu{background:var(--pu);color:#fff}
.btn-gh{background:var(--bg);color:var(--txt);border:1.5px solid var(--bdr)}
.btn-w{width:100%}.btn-sm{padding:6px 10px;font-size:11px;border-radius:6px}

.seg{display:flex;background:var(--seg-bg);border-radius:8px;padding:3px;gap:2px;margin-bottom:12px;flex-wrap:wrap}
.sbt{flex:1;min-width:50px;padding:6px 4px;border-radius:6px;border:none;background:none;font-size:11px;font-weight:700;color:var(--mt);cursor:pointer;font-family:'Hind Siliguri',sans-serif;transition:.12s;text-align:center}
.sbt.active{background:var(--card);color:var(--bl);box-shadow:0 1px 3px rgba(13,71,161,.15)}

.tbar{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.tb{flex:1;min-width:70px;padding:8px 4px;border-radius:7px;border:2px solid var(--bdr);background:var(--card);font-size:11px;font-weight:700;cursor:pointer;color:var(--mt);transition:.12s;text-align:center;font-family:'Hind Siliguri',sans-serif}
.tb.tg{border-color:var(--bl);background:var(--bll);color:var(--bl)}
.tb.tr_{border-color:var(--te);background:var(--tel);color:var(--te)}
.tb.td_{border-color:var(--re);background:var(--rel);color:var(--re)}
.tb.tb_{border-color:var(--gr);background:var(--grl);color:var(--gr)}

.img-sq{width:80px;height:80px;border-radius:10px;border:2px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
.img-sq img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px}
.img-cam{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:.2s;border-radius:8px}
.img-sq:hover .img-cam{opacity:1}

.sr-av{width:52px;height:52px;border-radius:50%;border:2px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--bl)}
.sr-av img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.sr-av-lg{width:76px;height:76px;border-radius:50%;border:2px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--bl);cursor:pointer}
.sr-av-lg img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.sr-av-lg .img-cam{border-radius:50%}
.sr-av-lg:hover .img-cam{opacity:1}
.up-lbl{display:block;text-align:center;margin-top:5px;font-size:10px;font-weight:700;color:var(--bl);cursor:pointer;background:var(--bll);border:1.5px dashed var(--bl);border-radius:6px;padding:4px 6px}

.pc{display:flex;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid #EEF2FF}
.pc:last-child{border-bottom:none}
.pc-img{width:52px;height:52px;border-radius:8px;border:1.5px solid var(--bdr);background:#EEF2FF;flex-shrink:0;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px}
.pc-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}

.sku-i{width:44px;height:44px;border-radius:8px;overflow:hidden;flex-shrink:0;border:1px solid var(--bdr);background:#EEF2FF;position:relative;display:flex;align-items:center;justify-content:center;font-size:20px}
.sku-i img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.sku-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #EEF2FF}
.sku-row:last-child{border-bottom:none}

.psel{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid #EEF2FF;cursor:pointer}
.psel:last-child{border-bottom:none}
.psel input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--bl)}
.psel-all{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bll);border-bottom:2px solid var(--bl);font-weight:700;color:var(--bl);font-size:12px}

.prow{background:#F8FAFF;border:1px solid var(--bdr);border-radius:9px;padding:9px;margin-bottom:7px}
.prow-h{display:flex;gap:7px;align-items:center;margin-bottom:7px}
.prow-h select{flex:1;font-size:12px}
.prow-del{background:var(--rel);color:var(--re);border:none;border-radius:6px;padding:7px 9px;cursor:pointer;font-size:14px;flex-shrink:0}
.prow-ins{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.prow-c{font-size:11px;color:var(--bl);margin-top:5px;font-weight:600;background:var(--bll);padding:4px 9px;border-radius:5px}

.tbl-w{overflow-x:auto;border-radius:8px;border:1px solid var(--bdr)}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:360px}
th{text-align:left;padding:7px 9px;background:var(--bl);color:#fff;font-weight:600;font-size:11px;white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid #EEF2FF;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F5F7FF}
.tf td{background:var(--bll);font-weight:700;border-top:2px solid var(--bl)}

.bdg{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700}
.b-bl{background:var(--bll);color:var(--bl)}.b-gr{background:var(--grl);color:var(--gr)}
.b-re{background:var(--rel);color:var(--re)}.b-am{background:var(--aml);color:var(--am)}
.b-te{background:var(--tel);color:var(--te)}.b-gy{background:#ECEFF1;color:var(--mt)}
.b-go{background:var(--gol);color:var(--go)}

.prof{border-radius:10px;padding:14px;text-align:center;margin-bottom:10px;color:#fff}
.prof-v{font-size:26px;font-weight:700}.prof-l{font-size:11px;opacity:.85;margin-top:2px}

.ib{background:var(--bll);border-left:3px solid var(--bl);border-radius:5px;padding:8px 11px;font-size:11px;color:var(--bl2);margin-bottom:10px;font-weight:600}
.wb{background:#FFF8E1;border-left:3px solid #FFA000;border-radius:5px;padding:8px 11px;font-size:11px;color:var(--am);margin-bottom:10px;font-weight:600}
.gib{background:var(--grl);border-left:3px solid var(--gr);border-radius:5px;padding:8px 11px;font-size:11px;color:var(--gr);margin-bottom:10px;font-weight:600}
.rib{background:var(--rel);border-left:3px solid var(--re);border-radius:5px;padding:8px 11px;font-size:11px;color:var(--re);margin-bottom:10px;font-weight:600}

.step-ind{display:flex;align-items:center;gap:5px;margin-bottom:12px}
.sdi{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sdi-a{background:var(--bl);color:#fff}.sdi-i{background:#E0E0E0;color:var(--mt)}
.sdl{flex:1;height:2px;background:#E0E0E0}.sdl.done{background:var(--bl)}

.dr{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-bottom:1px solid #EEF2FF}
.dr:last-child{border-bottom:none}
.stk-ok{color:var(--gr);font-weight:700}.stk-lo{color:var(--am);font-weight:700}.stk-no{color:var(--re);font-weight:700}

.dmg-card{border:2px solid var(--re);border-radius:10px;overflow:hidden;margin-bottom:10px}
.dmg-h{background:var(--re);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.bon-card{border:2px solid var(--am);border-radius:10px;overflow:hidden;margin-bottom:10px}
.bon-h{background:var(--am);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px}
.dm-img{width:40px;height:40px;border-radius:7px;overflow:hidden;flex-shrink:0;background:rgba(255,255,255,.2);position:relative;display:flex;align-items:center;justify-content:center;font-size:20px}
.dm-img img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}

.exp-cat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #EEF2FF}
.exp-cat-row:last-child{border-bottom:none}
.exp-inp-row{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid #EEF2FF}
.exp-inp-row:last-child{border-bottom:none}
.exp-inp-row label{font-size:12px;font-weight:600;min-width:110px;flex-shrink:0}
.exp-inp-row input{flex:1;padding:7px 10px}

/* DSR Dashboard */
.dsr-big{background:var(--card);border-radius:var(--rad);padding:16px;margin-bottom:10px;text-align:center;border:1px solid var(--bdr);box-shadow:var(--shad)}
.dsr-big .dv{font-size:32px;font-weight:700;line-height:1}
.dsr-big .dl{font-size:11px;color:var(--mt2);margin-top:4px}
.dsr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.dsr-cell{background:var(--card);border-radius:10px;padding:12px;text-align:center;border:2px solid var(--bdr)}
.dsr-cell .dv2{font-size:20px;font-weight:700}
.dsr-cell .dl2{font-size:9px;color:var(--mt2);margin-top:2px}
.dsr-cell .ds2{font-size:11px;color:var(--mt);margin-top:1px}

/* Low stock alert badge */
.low-alert{background:var(--rel);color:var(--re);font-size:9px;font-weight:700;padding:1px 5px;border-radius:6px;margin-left:4px}

/* Product Showcase */
.showcase-wrap{padding:0}
.showcase-header{background:linear-gradient(135deg,#0D2137,#0D47A1);border-radius:var(--rad);padding:16px 14px 14px;margin-bottom:12px;color:#fff;text-align:center}
.showcase-header h2{font-size:15px;font-weight:700;letter-spacing:1px;margin-bottom:2px}
.showcase-header p{font-size:11px;opacity:.75}
.showcase-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.sc-card{background:#fff;border-radius:12px;border:1.5px solid var(--bdr);box-shadow:0 2px 10px rgba(13,71,161,.08);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:.15s}
.sc-card:active{transform:scale(.97);box-shadow:0 1px 4px rgba(13,71,161,.12)}
.sc-img{width:100%;aspect-ratio:1/1;min-height:0;background:#fff;position:relative;display:flex;align-items:center;justify-content:center;font-size:44px;overflow:hidden;border-bottom:1px solid #EEF2FF}
.sc-img img{position:absolute;top:8px;left:8px;right:8px;bottom:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;display:block;background:#fff}
.sc-no-img{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mt2)}
.sc-no-img span{font-size:36px}
.sc-no-img small{font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.sc-info{padding:8px 9px 9px;display:flex;flex-direction:column;gap:0}
.sc-name{font-size:12px;font-weight:700;color:var(--txt);line-height:1.3;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;min-height:2.6em}
.sc-sku{display:inline-block;background:var(--bll);color:var(--bl);font-size:9px;font-weight:700;padding:1px 6px;border-radius:6px;margin-bottom:3px}
.sc-price{font-size:12px;font-weight:700;color:var(--gr);line-height:1.2}
.sc-price-sub{font-size:9px;color:var(--mt2);font-weight:400}
.sc-offer{font-size:9px;color:var(--am);font-weight:700;margin-top:2px;background:var(--aml);padding:1px 5px;border-radius:5px;display:inline-block}
.sc-modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.72);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sc-modal{background:#fff;border-radius:16px;width:100%;max-width:380px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.35);animation:modalup .2s cubic-bezier(.34,1.4,.64,1)}
@keyframes modalup{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.sc-modal-img{width:100%;aspect-ratio:1/1;background:#fff;border-bottom:1px solid #EEF2FF;position:relative;display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden}
.sc-modal-img img{position:absolute;top:8px;left:8px;width:calc(100% - 16px);height:calc(100% - 16px);object-fit:contain;display:block;background:#fff}
.sc-modal-body{padding:16px}
.sc-modal-name{font-size:17px;font-weight:700;color:var(--txt);margin-bottom:6px}
.sc-modal-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #EEF2FF;font-size:12px}
.sc-modal-row:last-child{border-bottom:none}
.sc-modal-label{color:var(--mt);font-weight:600}
.sc-modal-val{font-weight:700;color:var(--txt)}
.sc-close{position:absolute;top:10px;right:10px;width:32px;height:32px;background:rgba(255,255,255,.9);border:none;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:1}
.sc-filter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.sc-search{flex:1;min-width:120px}
.sc-empty{text-align:center;padding:32px 16px;color:var(--mt2)}
.sc-empty span{font-size:40px;display:block;margin-bottom:8px}
.sc-empty p{font-size:12px;font-weight:600}

/* Payment breakdown */
.pay-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #EEF2FF;font-size:12px}
.pay-row:last-child{border-bottom:none}

.ovl{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px}
.spin{width:36px;height:36px;border:3px solid var(--bll);border-top-color:var(--bl);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ovl-m{font-size:12px;color:var(--mt);font-weight:600}

// ════════════════════════════════════════════════════
//  API HELPER — replaces google.script.run
// ════════════════════════════════════════════════════
async function apiFetch(url, opts) {
  try {
    var options = Object.assign({ headers: {'Content-Type':'application/json'} }, opts || {});
    var res = await fetch(url, options);
    return await res.json();
  } catch(e) {
    return { ok: false, error: e.message };
  }
}
function apiGet(url) { return apiFetch(url); }
function apiPost(url, data) { return apiFetch(url, { method:'POST', body: JSON.stringify(data) }); }
function apiPut(url, data) { return apiFetch(url, { method:'PUT', body: JSON.stringify(data) }); }
function apiDel(url, data) { return apiFetch(url, { method:'DELETE', body: JSON.stringify(data) }); }

// ── Manager approval intercept ──────────────────────────────────────
// If current user is manager, routes submission to the pending-approvals
// staging table instead of writing directly to the main tables.
async function mgrPost(inputType, realUrl, data) {
  if (S.role === 'manager') {
    return apiPost('/api/sr-payments?action=approval_submit', {
      managerId:   S.userId,
      managerName: S.userName,
      inputType:   inputType,
      inputData:   data
    }).then(function(r){ return r && r.ok ? { ok:true, _mgr:true } : r; });
  }
  return apiPost(realUrl, data);
}

// ════════════════════════════════════════════════════
//  AUTH — 5-DIGIT PIN (auto role detect via /api/auth)
// ════════════════════════════════════════════════════
var ROLE_LABELS = { owner:'👑 Owner', manager:'🧑 Manager', so:'📊 SO', dsr:'🚚 DSR' };
var _pinBuf = '';

function pinKey(k) {
  if (_pinBuf.length >= 5) return;
  _pinBuf += k; updatePinDots();
  document.getElementById('pin-err').textContent = '';
  if (_pinBuf.length === 5) checkPin();
}
function pinDel() {
  _pinBuf = _pinBuf.slice(0,-1); updatePinDots();
  document.getElementById('pin-err').textContent = '';
}
function updatePinDots() {
  for (var i=0;i<5;i++) document.getElementById('pd'+i).classList.toggle('filled', i < _pinBuf.length);
}
async function checkPin() {
  var pin = _pinBuf;
  _pinBuf = ''; updatePinDots();
  document.getElementById('pin-err').textContent = '';

  var r = await apiPost('/api/auth', { password: pin });

  if (r && r.ok) {
    S.role     = r.role;
    S.userId   = r.userId;
    S.userName = r.userName;
    sessionStorage.setItem('axiion_session', JSON.stringify({ role: r.role, userId: r.userId, userName: r.userName }));
    document.getElementById('pin-screen').style.display = 'none';
    applyRole();
    // Always skip splash on login — go straight to app
    var spl = document.getElementById('spl');
    spl.classList.add('fade');
    spl.style.opacity = '0';
    spl.style.pointerEvents = 'none';
    document.getElementById('app').classList.add('show');
    loadAll();
  } else {
    _pinBuf = ''; updatePinDots();
    document.getElementById('pin-err').textContent = '❌ ' + ((r && r.error) || 'ভুল PIN');
    var d = document.querySelector('.pin-dots');
    if (d) ['-8px','8px','-4px','0'].forEach(function(v,i){ setTimeout(function(){ d.style.transform='translateX('+v+')'; }, i*80); });
  }
}
function applyRole() {
  var r = S.role;
  var badge = document.getElementById('role-badge');
  if (badge) {
    var label = ROLE_LABELS[r] || r;
    if (S.userName && r !== 'owner' && r !== 'manager') label += ' · ' + S.userName;
    badge.textContent = label;
  }
  // Nav visibility per role
  var show = {
    owner:   ['dash','prod','sr','tx','rep','exp','cal','extra'],
    manager: ['dash','prod','sr','tx','exp','cal','chat','numbers'],
    so:      ['dash','prod','chat','numbers'],
    dsr:     ['dash','chat','numbers']
  }[r] || ['dash'];
  ['dash','prod','sr','tx','rep','exp','cal','extra','chat','numbers'].forEach(function(t) {
    var el = document.getElementById('nb-'+t);
    if (el) el.style.display = show.indexOf(t) >= 0 ? '' : 'none';
  });
}
function logout() {
  if (!confirm('লগআউট করবেন?')) return;
  sessionStorage.removeItem('axiion_session');
  S.role = ''; S.userId = ''; S.userName = ''; _dashCache = null; S.dsrMode = 'today';
  _pinBuf = ''; updatePinDots();
  document.getElementById('app').classList.remove('show');
  // Fully reset splash so re-login works correctly
  var spl = document.getElementById('spl');
  spl.classList.remove('fade');
  spl.style.opacity = '1';
  spl.style.pointerEvents = '';
  spl.style.display = 'flex';
  document.getElementById('pin-screen').style.display = 'flex';
  document.getElementById('pin-err').textContent = '';
}

//  NOTICE PANEL — Owner UI

async function loadNoticePanel() {
  var el = document.getElementById('np-wrap'); if (!el) return;
  var r = await apiGet('/api/expenses?action=notice-get');
  if (!r || !r.ok) { el.innerHTML = '<div style="padding:16px;color:var(--re)">লোড ব্যর্থ</div>'; return; }
  S.activeNotice = r.notice;
  _renderNoticePanel(r.notice);
}

function _renderNoticePanel(notice) {
  var el = document.getElementById('np-wrap'); if (!el) return;
  var hasActive = notice && notice.content;
  var h = '';

  // Current status box
  h += '<div class="ct" style="margin-bottom:8px">📋 বর্তমান নোটিশ</div>';
  if (hasActive) {
    h += '<div class="card" style="margin-bottom:12px;border-left:4px solid #FFB300;padding:12px 14px">';
    h += '<div style="font-size:11px;color:var(--mt);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">';
    h += '<span style="display:inline-block;background:#E8F5E9;color:#2E7D32;border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700;border:1px solid #A5D6A7">✅ সক্রিয়</span>';
    h += '<span style="display:flex;gap:6px">';
    h += '<button class="btn" style="background:var(--am);color:#fff;padding:5px 12px;font-size:11px" ontouchstart="noticePause();event.preventDefault()" onclick="noticePause()">⏸ বিরতি</button>';
    h += '<button class="btn" style="background:var(--re);color:#fff;padding:5px 12px;font-size:11px" ontouchstart="noticeClear();event.preventDefault()" onclick="noticeClear()">🗑 মুছুন</button>';
    h += '</span></div>';
    h += '<div style="font-size:13px;font-weight:600;color:var(--txt);line-height:1.5;word-break:break-word">'+notice.content+'</div>';
    h += '</div>';
  } else {
    h += '<div class="card" style="margin-bottom:12px;text-align:center;padding:18px;color:var(--mt2);font-size:13px">';
    h += '<div style="font-size:28px;margin-bottom:6px">📭</div>কোনো সক্রিয় নোটিশ নেই';
    h += '</div>';
  }

  // Write / publish box
  h += '<div class="ct" style="margin-bottom:8px">'+(hasActive?'🔄 নোটিশ পরিবর্তন করুন':'✏️ নতুন নোটিশ লিখুন')+'</div>';
  h += '<div class="card" style="margin-bottom:12px">';
  h += '<div class="fg"><label class="fl">নোটিশ টেক্সট</label>';
  h += '<textarea id="np-input" rows="3" placeholder="এখানে নোটিশ লিখুন..." maxlength="200" style="width:100%;border:1.5px solid var(--bdr);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;resize:none;outline:none;color:var(--txt);background:var(--inp-bg);line-height:1.5" oninput="document.getElementById(\'np-count\').textContent=this.value.length"></textarea>';
  h += '<div style="text-align:right;font-size:10px;color:var(--mt2)"><span id="np-count">0</span>/200</div>';
  h += '</div>';
  h += '<button class="btn btn-bl btn-w" style="margin-top:8px" ontouchstart="noticePublish();event.preventDefault()" onclick="noticePublish()">📢 '+(hasActive?'পরিবর্তন করে প্রকাশ করুন':'প্রকাশ করুন')+'</button>';
  h += '</div>';

  el.innerHTML = h;
}

async function noticePublish() {
  var ta = document.getElementById('np-input'); if (!ta) return;
  var content = ta.value.trim();
  if (!content) return toast('নোটিশ টেক্সট লিখুন');
  showOvl('প্রকাশ হচ্ছে...');
  var r = await apiPost('/api/expenses?action=notice-publish', { content });
  hideOvl();
  if (!r || !r.ok) return toast(r.error || 'ব্যর্থ');
  S.activeNotice = { content };
  toast('✅ নোটিশ প্রকাশ হয়েছে');
  loadNoticePanel();
}

async function noticePause() {
  if (!confirm('নোটিশটি বিরতিতে দিবেন? ব্যবহারকারীরা দেখতে পাবে না।')) return;
  showOvl('আপডেট হচ্ছে...');
  var r = await apiPost('/api/expenses?action=notice-pause', {});
  hideOvl();
  if (!r || !r.ok) return toast(r.error || 'ব্যর্থ');
  S.activeNotice = null;
  toast('⏸ নোটিশ বিরতিতে আছে');
  loadNoticePanel();
}

async function noticeClear() {
  if (!confirm('নোটিশটি সম্পূর্ণ মুছে ফেলবেন?')) return;
  showOvl('মুছে যাচ্ছে...');
  var r = await apiPost('/api/expenses?action=notice-clear', {});
  hideOvl();
  if (!r || !r.ok) return toast(r.error || 'ব্যর্থ');
  S.activeNotice = null;
  toast('🗑 নোটিশ মুছে গেছে');
  loadNoticePanel();
}

async function loadOwnerApprovals() {

function renderOwnerApprovals() {
  var el = document.getElementById('oa-wrap'); if (!el) return;
  var pending = _oaData.filter(function(a){ return a.status === 'pending'; });
  var done    = _oaData.filter(function(a){ return a.status !== 'pending'; }).slice(0,20);
  var h = '';

  // Pending count banner
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">';
  h += '<div style="font-weight:700;font-size:13px">⏳ পেন্ডিং: <span style="color:var(--am)">'+pending.length+'টি</span></div>';
  if (pending.length) {
    h += '<button class="btn" style="background:var(--gr);color:#fff;padding:6px 14px;font-size:12px" onclick="approveAll()">✅ সব অনুমোদন করুন</button>';
  }
  h += '</div>';

  if (!pending.length) {
    h += '<div class="card" style="text-align:center;padding:20px;color:var(--mt2);font-size:13px">কোনো অনুমোদন পেন্ডিং নেই ✓</div>';
  } else {
    // Group by date
    var byDate = {};
    pending.forEach(function(a) {
      var dt = (a.submittedAt||'').slice(0,10);
      if (!byDate[dt]) byDate[dt] = [];
      byDate[dt].push(a);
    });
    Object.keys(byDate).sort(function(a,b){return b.localeCompare(a);}).forEach(function(dt) {
      h += '<div class="ct" style="font-size:12px">📅 '+fmtBn(dt)+'</div>';
      h += '<div class="card" style="padding:0;overflow:hidden">';
      byDate[dt].forEach(function(a) {
        var d = a.inputData || {};
        var typeLabel = oaTypeLabel(a.inputType, d);
        var summary   = oaSummary(a.inputType, d);
        h += '<div style="padding:10px 12px;border-bottom:1px solid var(--grl)">';
        h += '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">';
        h += '<div style="flex:1;min-width:0">';
        h += '<div style="font-weight:700;font-size:12px">'+esc(typeLabel)+' <span style="font-size:10px;color:var(--mt2)">· '+esc(a.managerName||'Manager')+'</span></div>';
        h += '<div style="font-size:11px;color:var(--mt2);margin-top:2px">'+esc(summary)+'</div>';
        h += '</div>';
        h += '<div style="display:flex;gap:6px;flex-shrink:0">';
        h += '<button class="btn btn-sm" style="background:var(--gr);color:#fff;font-size:11px;padding:4px 10px" onclick="approveOne(\''+a.id+'\')">✅ অনুমোদন</button>';
        h += '<button class="btn btn-sm" style="background:var(--re);color:#fff;font-size:11px;padding:4px 10px" onclick="rejectOne(\''+a.id+'\')">❌ বাতিল</button>';
        h += '</div></div></div>';
      });
      h += '</div>';
    });
  }

  // Recently processed
  if (done.length) {
    h += '<div class="ct" style="font-size:12px;margin-top:10px">✅ সম্প্রতি প্রক্রিয়া হয়েছে</div>';
    h += '<div class="card" style="padding:0;overflow:hidden">';
    done.forEach(function(a) {
      var d = a.inputData || {};
      var isApproved = a.status === 'approved';
      h += '<div style="padding:8px 12px;border-bottom:1px solid var(--grl);display:flex;align-items:center;justify-content:space-between">';
      h += '<div><div style="font-size:12px;font-weight:600">'+esc(oaTypeLabel(a.inputType,d))+'</div>';
      h += '<div style="font-size:10px;color:var(--mt2)">'+esc(a.managerName||'Manager')+' · '+(a.submittedAt||'').slice(0,10)+'</div></div>';
      h += '<span style="font-size:11px;font-weight:700;color:'+(isApproved?'var(--gr)':'var(--re)')+'">'+( isApproved?'✅ অনুমোদিত':'❌ বাতিল')+'</span>';
      h += '</div>';
    });
    h += '</div>';
  }

  el.innerHTML = h;
}

function oaTypeLabel(inputType, d) {
  var txMap = {give:'স্টক সরবরাহ',return:'ফেরত',damage:'ড্যামেজ',buy:'কেনা',point_sale:'পয়েন্ট সেল',point_damage_return:'পয়েন্ট ফেরত'};
  if (inputType==='transaction') return txMap[d.type]||d.type||'লেনদেন';
  if (inputType==='payment') return 'পেমেন্ট';
  if (inputType==='expense') return 'খরচ';
  return inputType;
}

function oaSummary(inputType, d) {
  if (inputType==='transaction') {
    var items = d.items||[];
    var total = items.reduce(function(s,i){return s+num(i.totalUnits);},0);
    var names = items.slice(0,2).map(function(i){return i.productName||'';}).filter(Boolean).join(', ');
    return (d.srName?'DSR: '+d.srName+' · ':'')+(names||'')+' · '+total+' পিস · '+fmtBn(d.date);
  }
  if (inputType==='payment') {
    var tot=(num(d.cashAmount)+num(d.commissionAmt)+num(d.discountAmt)+num(d.damageAmt))||num(d.amount);
    return (d.srName?d.srName+' · ':'')+' ৳'+fm(tot)+' · '+fmtBn(d.date);
  }
  if (inputType==='expense') {
    var ent=d.entries||[];
    var total2=ent.reduce(function(s,e){return s+num(e.amount);},0);
    return '৳'+fm(total2)+' · '+fmtBn(d.date);
  }
  return '';
}

var IMG = { prod:{full:'',name:'',thumb:'',previewUrl:''}, sr:{full:'',name:'',thumb:'',previewUrl:''} };
function getThumb(obj) {
  if (!obj) return ''; var t = String(obj.thumb||'');
  return (t.length>100 && t.indexOf('data:')===0) ? t : '';
}
function makeThumb(dataUrl, cb) {
  var img = new Image();
  img.onload = function() {
    try {
      var canvas = document.createElement('canvas'); canvas.width=600; canvas.height=600;
      var ctx = canvas.getContext('2d'), s=Math.min(img.width,img.height);
      var sx=(img.width-s)/2, sy=(img.height-s)/2;
      ctx.drawImage(img,sx,sy,s,s,0,0,600,600); cb(canvas.toDataURL('image/jpeg',0.92));
    } catch(e){ cb(''); }
  };
  img.onerror = function(){ cb(''); }; img.src = dataUrl;
}
function setContainerImg(container, src) {
  if (!container) return;
  var old = container.querySelector('img.injected'); if (old) old.remove();
  if (!src) return;
  var im = document.createElement('img');
  im.className='injected';
  im.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;z-index:1';
  im.onerror = function(){ im.remove(); };
  container.appendChild(im); im.src = src;
}
function pickImg(file, previewId, slot, maxMB) {
  if (!file) return;
  if (file.size > maxMB*1024*1024) { toast('ছবি '+maxMB+'MB এর কম হতে হবে'); return; }
  var rd = new FileReader();
  rd.onload = function(e) {
    var full = e.target.result; IMG[slot].full=full; IMG[slot].name=file.name; IMG[slot].previewUrl=full;
    var prv = document.getElementById(previewId); if (prv) setContainerImg(prv, full);
    makeThumb(full, function(thumb){ IMG[slot].thumb=thumb; });
  }; rd.readAsDataURL(file);
}
function thumbImg(obj, radius) {
  var src = getThumb(obj); if (!src) return '';
  return '<img src="'+src+'" alt="" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;border-radius:'+(radius||'inherit')+'" onerror="this.remove()">';
}

// ── Notice ticker engine (smooth, seamless, pixel-based) ──────────────
var _tickerRAF = null;
function _tickerStart() {
  if (_tickerRAF) { cancelAnimationFrame(_tickerRAF); _tickerRAF = null; }
  var el = document.getElementById('notice-ticker-el');
  if (!el) return;
  var track = el.parentElement; // .notice-track
  var trackW = track.clientWidth;
  var textW  = el.scrollWidth;
  var px = trackW + 10; // start fully off-screen right
  var speed = 55; // px/second — comfortable reading pace
  var last = null;
  el.style.transform = 'translateX(' + px + 'px)';
  function tick(ts) {
    if (last === null) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.05); // cap at 50ms to avoid jumps after tab switch
    last = ts;
    px -= speed * dt;
    if (px < -(textW + 20)) { px = trackW + 10; } // seamless loop — reset instantly
    el.style.transform = 'translateX(' + px + 'px)';
    _tickerRAF = requestAnimationFrame(tick);
  }
  _tickerRAF = requestAnimationFrame(tick);
}

function loadSoDash() {
  if (!S.soTxDate) S.soTxDate = iso(new Date());
  if (!S.soTxFrom) S.soTxFrom = iso(new Date());
  if (!S.soTxTo)   S.soTxTo   = iso(new Date());
  showOvl('লোড হচ্ছে...');
  Promise.all([
    apiGet('/api/load-all'),
    apiGet('/api/dashboard?role=so&userId='+encodeURIComponent(S.userId)),
    apiGet('/api/sr-payments?srId='+encodeURIComponent(S.userId))
  ]).then(function(res) {
    hideOvl();
    var allData=res[0], soData=res[1], pays=res[2];
    if (allData.ok) { S.products=allData.products||[]; S.srs=allData.srs||[]; S.stockMap=allData.stockMap||{}; }
    if (soData.ok) {
      S.soDashData     = soData;
      S.soAssignedDsrs = soData.assignedDsrs || [];
    }
    S.soPayments = Array.isArray(pays) ? pays : [];
    if (!S.soTab) S.soTab = 'overview';
    renderSoDash();
  });
}

function renderSoDash() {
  var el = document.getElementById('pg-dash'); if (!el) return;
  var tabs = [
    {id:'overview', lbl:'📊 সারসংক্ষেপ'},
    {id:'dsrs',     lbl:'👥 আমার DSR'},
    {id:'dsr-tx',   lbl:'📝 DSR লেনদেন'},
    {id:'dsr-dues', lbl:'💰 DSR বাকি'},
    {id:'sale',     lbl:'🛒 বিক্রয়'},
    {id:'stock',    lbl:'📦 স্টক'},
    {id:'catalogue', lbl:'🖼️ ক্যাটালগ'}
  ];
  var h=_noticeBanner()+'<div class="seg" style="margin-bottom:12px;flex-wrap:wrap">';
  tabs.forEach(function(tb){
    h+='<button class="sbt '+(S.soTab===tb.id?'active':'')+'" onclick="S.soTab=\''+tb.id+'\';renderSoDash()">'+tb.lbl+'</button>';
  });
  h+='</div>';
  if (S.soTab==='overview')  h+=_soOverview();
  else if (S.soTab==='dsrs')     h+=_soDsrList();
  else if (S.soTab==='dsr-tx')   h+=_soDsrTx();
  else if (S.soTab==='dsr-dues') h+=_soDsrDues();
  else if (S.soTab==='sale')     h+=_soSale();
  else if (S.soTab==='stock')     h+=_soStock();
  else if (S.soTab==='catalogue') h+=buildShowcasePage();
  h+='<div style="text-align:center;font-size:10px;color:var(--mt2);padding:8px">Miron Electronics · Powered by <span style="color:#FFD700;font-weight:700">AXIION</span></div>';
  el.innerHTML = h;
  setTimeout(_tickerStart, 50);
}

function soAssignDsr() {
  var sel=document.getElementById('so-assign-sel'); if (!sel) return;
  var dsrId=sel.value; if (!dsrId) return toast('DSR নির্বাচন করুন');
  showOvl('...');
  apiPut('/api/srs',{action:'assign_so',id:dsrId,soId:S.userId,soName:S.userName}).then(function(r){
    hideOvl();

    toast('✅ DSR নিযুক্ত হয়েছে'); loadSoDash();

function soUnassignDsr(dsrId) {
  if (!confirm('এই DSR কে সরিয়ে দেবেন?')) return;
  showOvl('...');
  apiPut('/api/srs',{action:'assign_so',id:dsrId,soId:'',soName:''}).then(function(r){
    hideOvl();
    if (!r||!r.ok) return toast(r&&r.error||'ব্যর্থ');
    toast('✅ DSR সরানো হয়েছে'); loadSoDash();
  });
}

function loadSoDsrTx() {
  var mode=S.soTxMode||'today', td=iso(new Date());
  var from=mode==='range'?S.soTxFrom:(S.soTxDate||td);

  S.soTxDate=from;
  showOvl('লোড হচ্ছে...');
  apiGet('/api/transactions?soId='+encodeURIComponent(S.userId)+'&from='+from+'&to='+to).then(function(r){
    hideOvl(); S.soDsrTxData=Array.isArray(r)?r:[]; S.soTab='dsr-tx'; renderSoDash();
  });
}

function soPsRemoveItem(i) { _soPsItems.splice(i,1); renderSoDash(); }

async function soSubmitSale() {
  var cust=(document.getElementById('so-ps-cust')||{}).value||'';
  var dt=(document.getElementById('so-ps-dt')||{}).value||iso(new Date());
  var slip=(document.getElementById('so-ps-slip')||{}).value||'';
  S.soPsCust=cust; S.soPsDate=dt; S.soPsSlip=slip;
  var items=[];
  for (var i=0;i<_soPsItems.length;i++){
    var it=_soPsItems[i];
    if (!it.productId) continue;
    var prod=S.products.find(function(p){return p.id===it.productId;});
    if (!prod) continue;
    var cs=num(it.cases), pc=num(it.pcs);
    if (!cs&&!pc) continue;
    var totalUnits=cs*(num(prod.caseSize)||1)+pc;
    items.push({productId:prod.id,productName:prod.name,sku:prod.sku,cases:cs,pcs:pc,totalUnits:totalUnits,purchasePrice:prod.purchasePrice,sellingPrice:prod.sellingPrice});
  }
  if (!items.length) return toast('অন্তত একটি পণ্য যোগ করুন');
  if (!cust.trim()) return toast('কাস্টমার নাম দিন');
  showOvl('সংরক্ষণ হচ্ছে...');
  var r=await apiPost('/api/transactions',{type:'point_sale',srId:S.userId,srName:S.userName+' → '+cust.trim(),date:dt,slipNo:slip,items:items});
  hideOvl();
  if (!r||!r.ok) return toast(r&&r.error||'ব্যর্থ');
  toast('✅ বিক্রয় সংরক্ষিত'); _soPsItems=[{productId:'',cases:'',pcs:''}]; S.stockMap={};
  loadSoDash();
}

function _soStock() {
  var h='<div class="ct">📦 স্টক ও মূল্য তালিকা</div>';
  h+='<div class="card" style="padding:0;overflow:hidden">';
  var totalV=0, totalB=0, totalPcs=0;
  S.products.forEach(function(p){
    var stk=S.stockMap[p.id]||0, cs=num(p.caseSize)||1;
    var cases=Math.floor(stk/cs), rem=stk%cs;
    var sv=stk*num(p.sellingPrice), bv=stk*num(p.purchasePrice);
    totalV+=sv; totalB+=bv; totalPcs+=stk;
    var sc=stk>10?'var(--gr)':stk>0?'var(--am)':'var(--re)';
    var alert=num(p.lowStockAlert)>0&&stk<=num(p.lowStockAlert), ti=thumbImg(p,'8px');
    h+='<div class="sku-row"><div class="sku-i">'+(ti||'📦')+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12px">'+esc(p.name)+(alert?'<span class="low-alert">কম!</span>':'')+'</div>';
    h+='<div style="font-size:10px;color:var(--mt2)">'+esc(p.sku)+' · বিক্রয়: ৳'+fm(p.sellingPrice)+'/পিস · ক্রয়: ৳'+fm(p.purchasePrice)+'/পিস</div>';
    h+='<div style="font-size:11px;font-weight:600;color:'+sc+';margin-top:2px">';
    if (stk>0){ if(cases)h+=cases+' '+(p.unitType||'কেস')+' '; if(rem)h+=rem+' পিস'; } else h+='স্টক নেই';
    h+='</div></div>';
    h+='<div style="text-align:right"><div style="font-size:12px;font-weight:700;color:var(--bl)">'+fn(stk)+' পিস</div><div style="font-size:10px;color:var(--gr)">৳'+fm(sv)+'</div></div></div>';
  });
  h+='<div style="padding:10px 12px;background:var(--grl);border-top:2px solid var(--gr)">';
  h+='<div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-bottom:3px"><span>মোট স্টক</span><span style="color:var(--bl)">'+fn(totalPcs)+' পিস</span></div>';
  h+='<div style="display:flex;justify-content:space-between;font-size:11px"><span>মোট মূল্য (বিক্রয়)</span><span style="color:var(--gr);font-weight:700">৳'+fm(totalV)+'</span></div>';

  h+='</div></div>';
  return h;
}

function renderProd() {
  var isOwner = S.role==='owner';
  var isMgr   = S.role==='manager';

    tabs += '</div>';
    el.innerHTML = tabs + buildStockPage();
    return;
  }
  tabs += '<button class="sbt '+(S.prodTab==='list'?'active':'')+'\" onclick="S.prodTab=\'list\';renderProd()">📋 তালিকা</button>';
  if (canEdit) tabs += '<button class="sbt '+(S.prodTab==='add'?'active':'')+'\" onclick="S.prodTab=\'add\';renderProd()">➕ যোগ করুন</button>';

  tabs += '</div>';

  el.innerHTML = tabs + (S.prodTab==='add'?buildProdForm():S.prodTab==='stock'?buildStockPage():S.prodTab==='showcase'?buildShowcasePage():buildProdList(canEdit));

  if (S.prodTab==='add') {
    var p2 = S.editProdId ? S.products.find(function(x){return x.id===S.editProdId;}) : null;
    setTimeout(function(){
      var prv=document.getElementById('pf-prv'); if (!prv) return;

    return p.name.toLowerCase().indexOf(q)>=0 || p.sku.toLowerCase().indexOf(q)>=0;

  var h = '<div class="showcase-wrap">';

  // Header banner
  h += '<div class="showcase-header">';
  h += '<h2>🖼️ পণ্যের ছবি</h2>';
  h += '<p>ব্যবসায়িক অংশীদারদের জন্য পণ্য ক্যাটালগ</p>';
  h += '</div>';

  // Search filter
  h += '<div class="sc-filter">';
  h += '<input class="sc-search" placeholder="🔍 পণ্য খুঁজুন..." value="'+(q?esc(q):'')+'" oninput="S.showcaseQ=this.value;renderProd()">';
  h += '</div>';

  if (!filtered.length) {
    h += '<div class="sc-empty"><span>🔍</span><p>কোনো পণ্য পাওয়া যায়নি</p></div>';
    h += '</div>';
    return h;
  }

  h += '<div class="showcase-grid">';
  filtered.forEach(function(p) {
    var thumb = getThumb(p);
    var imgHtml = thumb
      ? '<div class="sc-img"><img src="'+thumb+'" alt="'+esc(p.name)+'" onerror="this.style.visibility=\'hidden\'"></div>'
      : '<div class="sc-img"><div class="sc-no-img"><span>📦</span><small>NO IMAGE</small></div></div>';

    var offer = '';
    if (num(p.bonusFreeUnits)) {
      offer = '<div class="sc-offer">🎁 '+p.bonusCasesReq+(p.unitType||'কেস')+'এ '+p.bonusFreeUnits+'পিস ফ্রি'+(num(p.bonusFreeMoney)?' + ৳'+fm(p.bonusFreeMoney):'')+'</div>';
    }

    h += '<div class="sc-card" onclick="openShowcaseModal(\''+p.id+'\')">';
    h += imgHtml;
    h += '<div class="sc-info">';
    h += '<div class="sc-name">'+esc(p.name)+'</div>';
    h += '<div><span class="sc-sku">'+esc(p.sku)+'</span></div>';
    h += '<div class="sc-price">৳'+fm(p.sellingPrice)+' <span class="sc-price-sub">/ পিস</span></div>';
    if (offer) h += offer;
    h += '</div>';
    h += '</div>';
  });
  h += '</div></div>';
  return h;
}

function openShowcaseModal(id) {
  var p = S.products.find(function(x){return x.id===id;});
  if (!p) return;
  var thumb = getThumb(p);
  var stk = S.stockMap[p.id]||0;
  var cs = num(p.caseSize)||1;
  var cases = Math.floor(stk/cs), rem = stk%cs;
  var sc = stk>10?'var(--gr)':stk>0?'var(--am)':'var(--re)';

  var imgHtml = thumb
    ? '<img src="'+thumb+'" alt="'+esc(p.name)+'" onerror="this.style.visibility=\'hidden\'">'
    : '<span style="font-size:80px">📦</span>';

  var offer = '';
  if (num(p.bonusFreeUnits)) {
    offer = '<div class="sc-modal-row"><span class="sc-modal-label">🎁 অফার</span><span class="sc-modal-val" style="color:var(--am)">'+p.bonusCasesReq+(p.unitType||'কেস')+'এ '+p.bonusFreeUnits+'পিস ফ্রি'+(num(p.bonusFreeMoney)?' + ৳'+fm(p.bonusFreeMoney):'')+'</span></div>';
  }

  var stkTxt = stk>0?((cases>0?cases+' '+(p.unitType||'কেস')+' ':'')+( rem>0?rem+' পিস':'')):'স্টক নেই';

  var html = '<div class="sc-modal-bg" id="sc-modal-bg" onclick="closeShowcaseModal(event)">';
  html += '<div class="sc-modal" onclick="event.stopPropagation()">';
  html += '<div class="sc-modal-img" style="position:relative">'+imgHtml;
  html += '<button class="sc-close" onclick="closeShowcaseModal()">✕</button>';
  html += '</div>';
  html += '<div class="sc-modal-body">';
  html += '<div class="sc-modal-name">'+esc(p.name)+'</div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">SKU</span><span class="sc-modal-val"><span class="bdg b-bl">'+esc(p.sku)+'</span></span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">'+(p.unitType||'কেস')+'এ পিস</span><span class="sc-modal-val">'+p.caseSize+' পিস / '+(p.unitType||'কেস')+'</span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">বিক্রয় মূল্য</span><span class="sc-modal-val" style="color:var(--gr);font-size:15px">৳'+fm(p.sellingPrice)+' / পিস</span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">'+(p.unitType||'কেস')+' মূল্য</span><span class="sc-modal-val">৳'+fm(num(p.sellingPrice)*cs)+' / '+(p.unitType||'কেস')+'</span></div>';
  html += '<div class="sc-modal-row"><span class="sc-modal-label">স্টক</span><span class="sc-modal-val" style="color:'+sc+'">'+stkTxt+'</span></div>';
  if (offer) html += offer;
  html += '</div></div></div>';

  var existing = document.getElementById('sc-modal-bg');
  if (existing) existing.remove();
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeShowcaseModal(e) {
  if (e && e.target !== document.getElementById('sc-modal-bg')) return;
  var m = document.getElementById('sc-modal-bg'); if (m) m.remove();
}

    if (num(p.bonusFreeUnits)) h+='<div style="font-size:10px;color:var(--am)">🎁 '+p.bonusCasesReq+(p.unitType||'কেস')+'এ '+p.bonusFreeUnits+'পিস ফ্রি'+(num(p.bonusFreeMoney)?' + ৳'+fm(p.bonusFreeMoney):'')+'</div>';
    h+='</div>';
    if (canEdit) {
      h+='<div style="display:flex;gap:5px;flex-shrink:0">';

      h+='<button class="btn btn-sm" style="background:var(--rel);color:var(--re)" onclick="delProd(\''+p.id+'\')">🗑️</button>';
      h+='</div>';

function filterProds(q) {
  var filtered = q ? S.products.filter(function(p){ return p.name.toLowerCase().indexOf(q.toLowerCase())>=0||p.sku.toLowerCase().indexOf(q.toLowerCase())>=0; }) : S.products;
  var el=document.getElementById('prod-list-body'); if(el) el.innerHTML=buildProdRows(filtered, S.role==='owner', S.role==='owner');
}

function buildStockPage() {
  var totalSell=0, totalCost=0, totalPcs=0;
  var isOwner = S.role==='owner';
  var isSO    = S.role==='so';
  var h='<div class="card" style="padding:0;overflow:hidden">';
  S.products.forEach(function(p){
    var stk=S.stockMap[p.id]||0, cs=num(p.caseSize)||1;
    var cases=Math.floor(stk/cs), rem=stk%cs;
    var sv=stk*num(p.sellingPrice), cv=stk*num(p.purchasePrice);
    totalSell+=sv; totalCost+=cv; totalPcs+=stk;
    var sc=stk>10?'var(--gr)':stk>0?'var(--am)':'var(--re)';
    var alert=num(p.lowStockAlert)>0&&stk<=num(p.lowStockAlert);
    var ti=thumbImg(p,'8px');
    h+='<div class="sku-row"><div class="sku-i">'+(ti||'📦')+'</div>';
    h+='<div style="flex:1;min-width:0"><div style="font-weight:700;font-size:12px">'+esc(p.name)+(alert?'<span class="low-alert">কম!</span>':'')+'</div>';
    h+='<div style="font-size:10px;color:var(--mt2)">'+esc(p.sku)+'</div>';
    // Case + Pcs separate display
    h+='<div style="font-size:11px;font-weight:600;color:'+sc+';margin-top:2px">';
    if (stk>0) {
      if (cases>0) h+=cases+' '+(p.unitType||'কেস')+' ';
      if (rem>0) h+=rem+' পিস';
      if (!cases&&!rem) h=h; // handle edge
    } else { h+='স্টক নেই'; }
    h+='</div>';
    h+='<div style="font-size:10px;color:var(--mt);margin-top:1px">মোট: '+fn(stk)+' পিস</div>';
    h+='</div>';
    h+='<div style="text-align:right">';
    h+='<div style="font-size:12px;font-weight:700;color:var(--gr)">৳'+fm(sv)+'</div>';
    if (isOwner) h+='<div style="font-size:10px;color:var(--mt)">ক্রয়: ৳'+fm(cv)+'</div>';
    h+='</div></div>';
  });
  // Total footer
  h+='<div style="padding:10px 12px;background:var(--grl);border-top:2px solid var(--gr)">';
  h+='<div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-bottom:3px"><span>মোট স্টক (পিস)</span><span style="color:var(--bl)">'+fn(totalPcs)+' পিস</span></div>';
  h+='<div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px"><span>মোট মূল্য (বিক্রয়)</span><span style="color:var(--gr)">৳'+fm(totalSell)+'</span></div>';
  if (isOwner || isSO) {
    h+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--mt);margin-top:2px"><span>মোট মূল্য (ক্রয়)</span><span>৳'+fm(totalCost)+'</span></div>';
  }
  if (isOwner) {
    h+='<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:2px"><span style="font-weight:600">সম্ভাব্য লাভ</span><span style="color:var(--gr);font-weight:700">৳'+fm(totalSell-totalCost)+'</span></div>';
  }
  h+='</div></div>';
  return h;
}

async function saveProd() {
  var nm=v('pf-nm').trim(), sku=v('pf-sku').trim();
  if (!nm||!sku) return toast('নাম ও SKU আবশ্যক');
  var existP = S.editProdId ? S.products.find(function(p){return p.id===S.editProdId;}) : null;
  var d={name:nm, sku:sku, caseSize:vn('pf-cs')||12, purchasePrice:vn('pf-bp'),
    sellingPrice:vn('pf-sp'), bonusFreeUnits:vn('pf-bfu'), bonusCasesReq:vn('pf-bcr')||1,
    bonusFreeMoney:vn('pf-bfm'), lowStockAlert:vn('pf-lsa'), unitType:v('pf-unit')||'কেস'};
  if (S.editProdId) d.id = S.editProdId;
  d.thumb = IMG.prod.thumb || (existP ? existP.thumb||'' : '');
  showOvl('সংরক্ষণ হচ্ছে...');
  var r = S.editProdId ? await apiPut('/api/products', d) : await apiPost('/api/products', d);
  hideOvl();
  if (r.ok) {
    toast(S.editProdId?'আপডেট হয়েছে':'পণ্য যোগ হয়েছে');
    IMG.prod={full:'',name:'',thumb:'',previewUrl:''};
    cxProd(); loadAll();
  } else toast(r.error||'ব্যর্থ');
}
function editProd(id){S.editProdId=id;IMG.prod={full:'',name:'',thumb:'',previewUrl:''};S.prodTab='add';renderProd();}
function cxProd(){S.editProdId=null;IMG.prod={full:'',name:'',thumb:'',previewUrl:''};S.prodTab='list';renderProd();}
function updProdFormUnit(){var u=v('pf-unit')||'কেস';var lbl=document.getElementById('pf-bcr-lbl');if(lbl)lbl.textContent='প্রতি কত '+u;var csLbl=document.getElementById('pf-cs-lbl');if(csLbl)csLbl.textContent=u+'এ পিস';}
async function delProd(id){
  if (!confirm('এই পণ্য মুছবেন?')) return; showOvl('...');
  var r=await apiDel('/api/products',{id:id}); hideOvl();
  if(r.ok){toast('মুছা হয়েছে');loadAll();}else toast(r.error);
}

async function saveSR() {
  var nm=v('sf-nm').trim(); if(!nm) return toast('নাম আবশ্যক');
  var existSR=S.editSRId?S.srs.find(function(s){return s.id===S.editSRId;}):null;
  var role=v('sf-rl')||'dsr';
  var d={name:nm, phone:v('sf-ph'), area:v('sf-ar'), role:role};
  if(S.editSRId) d.id=S.editSRId;
  d.thumb=IMG.sr.thumb||(existSR?existSR.thumb||'':'');
  showOvl('...');
  var r=S.editSRId?await apiPut('/api/srs',d):await apiPost('/api/srs',d);
  hideOvl();
  if(r.ok){
    if (!S.editSRId && r.id) {
      // New enrollment: auto-generate a unique PIN server-side
      var pwR = await apiPut('/api/auth', { action:'upsert', userKey: r.id, userName: nm, role: role, autoPin: true });
      var pin = pwR && pwR.password ? pwR.password : '?????';
      toast('✅ '+nm+' যোগ হয়েছে — PIN: '+pin);
    } else if (S.editSRId) {
      // Edit: only update name & role, never overwrite the existing PIN
      await apiPut('/api/auth', { action:'update_meta', userKey: S.editSRId, userName: nm, role: role });
      toast('✅ আপডেট হয়েছে');
    }
    S.editSRId=null;IMG.sr={full:'',name:'',thumb:'',previewUrl:''};S.srTab='list';loadAll();
  } else toast(r.error||'ব্যর্থ');
}
async function delSR(id){
  if(!confirm('DSR/SO সরাবেন?'))return;showOvl('...');
  var r=await apiDel('/api/srs',{id:id});hideOvl();
  if(r.ok){
    // Also remove password entry
    await apiPut('/api/auth', { action:'delete', userKey: id });
    toast('সরানো হয়েছে');loadAll();
  } else toast(r.error);
}
async function savePay() {
  var srId=v('pf-sr'); if(!srId) return toast('DSR/SO বাছাই করুন');
  var cash=vn('pf-cash'),comm=vn('pf-comm'),disc=vn('pf-disc'),dmgAmt=vn('pf-dmg');
  var total=cash+comm+disc+dmgAmt;
  if(!total) return toast('কমপক্ষে একটি পরিমাণ দিন');
  var sr=S.srs.find(function(s){return s.id===srId;});
  showOvl('...');
  var payPayload={srId:srId,srName:sr?sr.name:'',date:v('pf-dt')||iso(new Date()),cashAmount:cash,commissionAmt:comm,discountAmt:disc,damageAmt:dmgAmt,amount:total,note:v('pf-nt')};
  var r=await mgrPost('payment','/api/sr-payments',payPayload);
  hideOvl();
  if(r&&r._mgr){toast('⏳ অনুমোদনের জন্য জমা হয়েছে!');sv('pf-cash','');sv('pf-comm','');sv('pf-disc','');sv('pf-dmg','');sv('pf-nt','');updPayTotal();return;}
  if(r&&r.ok){toast('পেমেন্ট রেকর্ড হয়েছে');sv('pf-cash','');sv('pf-comm','');sv('pf-disc','');sv('pf-dmg','');sv('pf-nt','');updPayTotal();}
  else toast(r&&r.error||'ব্যর্থ');
}

function stepBar(step) {
  var labs=['DSR/SO বাছাই','পণ্য বাছাই','পরিমাণ'], h='<div class="step-ind">';
  labs.forEach(function(l,i){
    h+='<div class="sdi '+(i<step?'sdi-a':'sdi-i')+'">'+(i+1)+'</div>';
    if(i<labs.length-1)h+='<div class="sdl '+(i<step-1?'done':'')+'" ></div>';
  });
  return h+'</div>';
}
function genUID(prefix) {
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789', u=prefix+'-';
  for(var i=0;i<4;i++) u+=c[Math.floor(Math.random()*c.length)];
  u+='-';
  for(var j=0;j<4;j++) u+=c[Math.floor(Math.random()*c.length)];
  return u;
}
function barcodeDiv(uid) {
  var bars='', code=uid.replace(/-/g,'');
  for(var i=0;i<code.length;i++){
    var ch=code.charCodeAt(i),w=((ch%3)+1)*3,dark=(ch%2===0);
    bars+='<div style="display:inline-block;width:'+w+'px;height:32px;background:'+(dark?'#111':'transparent')+'"></div>';
    bars+='<div style="display:inline-block;width:2px;height:32px;background:transparent"></div>';
  }
  return '<div style="text-align:center;margin:6px 0">'
    +'<div style="display:inline-block;border:1.5px solid #444;padding:4px 10px 2px;border-radius:3px;background:#fff">'
    +'<div style="display:flex;justify-content:center;align-items:flex-end">'+bars+'</div>'
    +'<div style="font-family:monospace;font-size:9px;letter-spacing:3px;font-weight:700;color:#222;margin-top:2px">'+uid+'</div>'
    +'</div></div>';
}

function buildGiveWiz() {
  if (S.giveStep===1) {
    var opts=S.srs.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+(s.area?' ('+esc(s.area)+')':'')+'</option>';}).join('');

    var rows=S.products.map(function(p){
      var stk=S.stockMap[p.id]||0, swc=stk>10?'stk-ok':stk>0?'stk-lo':'stk-no';

      return '<div class="psel" onclick="togProd(\''+p.id+'\')">'
        +'<input type="checkbox" '+(S.giveSelProd[p.id]?'checked':'')+' onclick="event.stopPropagation();S.giveSelProd[\''+p.id+'\']=this.checked">'
        +'<div class="sku-i" style="width:36px;height:36px;font-size:16px">'+(ti||'📦')+'</div>'

        +'<div style="font-size:10px;color:var(--mt2)">'+esc(p.sku)+' · ৳'+fm(p.sellingPrice)+'/পিস</div></div>'
        +'<div class="'+swc+'" style="font-size:12px;flex-shrink:0">'+fn(stk)+' পিস</div></div>';
    }).join('');
    return stepBar(2)+'<div class="card" style="padding:0;overflow:hidden">'
      +'<div class="psel-all"><input type="checkbox" id="chk-all" '+(selCnt===S.products.length&&S.products.length?'checked':'')+' onchange="selAll()"><label for="chk-all" style="cursor:pointer;flex:1">সব পণ্য বাছাই করুন</label><span>'+selCnt+'টি</span></div>'
      +rows+'</div>'
      +'<div style="display:flex;gap:7px;margin-top:10px"><button class="btn btn-gh" onclick="S.giveStep=1;renderTx()">← ফিরুন</button><button class="btn btn-bl" style="flex:1" onclick="gNext2()">পরিমাণ দিন →</button></div>';
  }
  // Step 3
  var rows3='';
  S.giveItems.forEach(function(item,i){
    var p=S.products.find(function(pr){return pr.id===item.productId;}); if(!p)return;
    var ti=thumbImg(p,'7px');
    rows3+='<div class="prow"><div style="display:flex;gap:8px;align-items:center;margin-bottom:7px">'
      +'<div class="sku-i" style="width:34px;height:34px;font-size:14px">'+(ti||'📦')+'</div>'
      +'<div><div style="font-weight:700;font-size:12px">'+esc(p.name)+'</div>'

      +'<div class="prow-ins">'
      +'<div><label class="fl">'+(p.unitType||'কেস')+'</label><input type="number" inputmode="decimal" min="0" placeholder="০" value="'+(item.cases||'')+'" id="give-c-'+i+'" oninput="S.giveItems['+i+'].cases=this.value;updGiveSub('+i+')"></div>'
      +'<div><label class="fl">পিস</label><input type="number" inputmode="decimal" min="0" placeholder="০" value="'+(item.pcs||'')+'" id="give-p-'+i+'" oninput="S.giveItems['+i+'].pcs=this.value;updGiveSub('+i+')"></div>'
      +'</div>'
      +'<div class="prow-c" id="give-sub-'+i+'">—</div>'
      +'</div>';
  });
  return stepBar(3)+'<div class="gib">SR: <strong>'+esc(S.giveSRName)+'</strong> · '+fmtBn(S.giveDate)+'</div>'
    +rows3
    +'<div id="give-grand" style="background:var(--bll);border-radius:7px;padding:9px 12px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--bl);display:flex;justify-content:space-between"><span>মোট: ০ পিস</span><span>৳০</span></div>'
    +'<div style="display:flex;gap:7px"><button class="btn btn-gh" onclick="S.giveStep=2;renderTx()">← পণ্য বদলান</button><button class="btn btn-bl" style="flex:1" onclick="saveGive()">📤 স্লিপ তৈরি ও সংরক্ষণ</button></div>';

function updGiveSub(i) {
  var item=S.giveItems[i];
  var p=S.products.find(function(pr){return pr.id===item.productId;}); if(!p)return;
  var cs=num(p.caseSize)||1, ca=num(item.cases)||0, pc=num(item.pcs)||0, u=ca*cs+pc;
  var amt=u*num(p.sellingPrice);
  var el=document.getElementById('give-sub-'+i);
  if(el)el.textContent=u>0?( ca?ca+(p.unitType||'কেস')+'×'+cs+'='+u+'পিস':u+'পিস')+' · ৳'+fm(amt):'—';
  // Update grand
  var grand=0,grandU=0;
  S.giveItems.forEach(function(it){
    var pr=S.products.find(function(r){return r.id===it.productId;}); if(!pr)return;
    var c2=num(pr.caseSize)||1, ca2=num(it.cases)||0, pc2=num(it.pcs)||0, u2=ca2*c2+pc2;
    grand+=u2*num(pr.sellingPrice); grandU+=u2;
  });
  var gEl=document.getElementById('give-grand');
  if(gEl)gEl.innerHTML='<span>মোট: '+grandU+' পিস</span><span>৳'+fm(grand)+'</span>';
}

function gNext1(){S.giveSRId=v('gs-sr');S.giveDate=v('gs-dt')||iso(new Date());if(!S.giveSRId)return toast('DSR/SO বাছাই করুন');var sr=S.srs.find(function(s){return s.id===S.giveSRId;});S.giveSRName=sr?sr.name:'';S.giveArea=sr?sr.area||'':'';S.giveStep=2;renderTx();}

function selAll(){var el=document.getElementById('chk-all');if(!el)return;S.products.forEach(function(p){S.giveSelProd[p.id]=el.checked;});renderTx();}
function gNext2(){var sel=S.products.filter(function(p){return S.giveSelProd[p.id];});if(!sel.length)return toast('কমপক্ষে একটি পণ্য বাছাই করুন');var ex={};S.giveItems.forEach(function(i){ex[i.productId]={cases:i.cases,pcs:i.pcs};});S.giveItems=sel.map(function(p){return{productId:p.id,cases:ex[p.id]?ex[p.id].cases:'',pcs:ex[p.id]?ex[p.id].pcs:''};});S.giveStep=3;renderTx();setTimeout(function(){S.giveItems.forEach(function(_,i){updGiveSub(i);});},0);}

async function saveGive(){
  var valid=S.giveItems.filter(function(i){return i.productId&&(num(i.cases)+num(i.pcs))>0;});
  if(!valid.length)return toast('কমপক্ষে একটি পরিমাণ দিন');
  var slipNo=genUID('ME-GV');
  var items=valid.map(function(i){var p=S.products.find(function(pr){return pr.id===i.productId;});var cs=num(p.caseSize)||1,ca=num(i.cases)||0,pc=num(i.pcs)||0,u=ca*cs+pc;return{productId:p.id,productName:p.name,sku:p.sku,cases:ca,pcs:pc,totalUnits:u,purchasePrice:num(p.purchasePrice),sellingPrice:num(p.sellingPrice),unitType:p.unitType||'কেস',thumb:p.thumb||''};});
  var txPayload={type:'give',srId:S.giveSRId,srName:S.giveSRName,date:S.giveDate,slipNo:slipNo,items:items};
  showOvl('সংরক্ষণ হচ্ছে...');
  var r=await mgrPost('transaction','/api/transactions',txPayload);
  hideOvl();
  if(!r.ok)return toast(r.error||'ব্যর্থ');
  if(r._mgr){toast('⏳ অনুমোদনের জন্য জমা হয়েছে!');var slip={slipNo:slipNo,date:S.giveDate,srName:S.giveSRName,srArea:S.giveArea,items:items,pendingApproval:true};S.lastSlip=slip;openSlipWin(slip);S.giveStep=1;S.giveSRId='';S.giveSRName='';S.giveArea='';S.giveSelProd={};S.giveItems=[];renderTx();return;}
  var slip={slipNo:slipNo,date:S.giveDate,srName:S.giveSRName,srArea:S.giveArea,items:items};
  S.lastSlip=slip; _dashCache=null;
  toast('✅ স্টক রেকর্ড হয়েছে!');
  openSlipWin(slip);
  items.forEach(function(i){S.stockMap[i.productId]=(S.stockMap[i.productId]||0)-i.totalUnits;});
  S.giveStep=1;S.giveSRId='';S.giveSRName='';S.giveArea='';S.giveSelProd={};S.giveItems=[];
  renderTx();
}

function psStepBar(step) {
  var labs=['কাস্টমার','পণ্য বাছাই','পরিমাণ'], h='<div class="step-ind">';
  labs.forEach(function(l,i){

    if(i<labs.length-1)h+='<div class="sdl '+(i<step-1?'done':'')+'" ></div>';

}

  var slip={slipNo:slipNo,date:S.psDmgDate,srName:S.psDmgCustName,srArea:'',items:items,slipTitle:'— পয়েন্ট সেল ফেরত স্লিপ —',isPointSale:true};
  _dashCache=null;
  toast('✅ ফেরত রেকর্ড হয়েছে!');
  openPointSaleSlip(slip);
  items.forEach(function(i){S.stockMap[i.productId]=(S.stockMap[i.productId]||0)+i.totalUnits;});
  S.psDmgStep=1;S.psDmgCustName='';S.psDmgSelProd={};S.psDmgItems=[];
  renderTx();

function _showSlipSharePanel(slipNo, slipBodyHtml) {
  // Overlay
  var ov=document.createElement('div');
  ov.id='slip-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:9998;display:flex;align-items:center;justify-content:center';

  // Panel
  var panel=document.createElement('div');
  panel.style.cssText='background:#fff;border-radius:14px;width:92%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.3);font-family:\'Hind Siliguri\',sans-serif';

  panel.innerHTML=
    '<div style="padding:14px 16px 10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center">'
    +'<span style="font-size:15px;font-weight:700;color:#1a237e">📋 স্লিপ তৈরি হচ্ছে…</span>'
    +'<button onclick="document.getElementById(\'slip-overlay\').remove()" style="border:none;background:#eee;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:14px">✕</button>'
    +'</div>'
    +'<div id="slip-preview" style="padding:12px;background:#f5f5f5;text-align:center;min-height:120px">'
    +'<div style="padding:30px;color:#777">⏳ রেন্ডার হচ্ছে…</div>'
    +'</div>'
    +'<div id="slip-actions" style="padding:12px;display:none;flex-direction:column;gap:8px"></div>';

  ov.appendChild(panel);
  document.body.appendChild(ov);

  // Hidden iframe to render slip
  var iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;left:-9999px;top:-9999px;width:440px;height:800px;border:none;visibility:hidden';
  document.body.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(slipBodyHtml);
  iframe.contentDocument.close();

  // Load html2canvas then capture
  function doCapture(){
    var sc=document.createElement('script');
    sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    sc.onload=function(){
      // Wait for fonts inside iframe
      setTimeout(function(){
        html2canvas(iframe.contentDocument.body,{
          scale:2,useCORS:true,allowTaint:true,
          backgroundColor:'#ffffff',logging:false,
          width:420,windowWidth:440
        }).then(function(canvas){
          iframe.remove();
          var jpgDataUrl=canvas.toDataURL('image/jpeg',0.93);
          var pdfHtml=slipBodyHtml; // for print path

          // Show preview image
          var prev=document.getElementById('slip-preview');
          if(!prev)return;
          var img=document.createElement('img');
          img.src=jpgDataUrl;
          img.style.cssText='width:100%;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.15)';
          prev.innerHTML='';
          prev.appendChild(img);

          // Update title
          panel.querySelector('span').textContent='✅ স্লিপ '+slipNo+' তৈরি হয়েছে';

          // Action buttons
          var acts=document.getElementById('slip-actions');
          if(!acts)return;
          acts.style.display='flex';

          function mkBtn(label,color,fn){
            var b=document.createElement('button');
            b.innerHTML=label;
            b.style.cssText='padding:13px;border:none;border-radius:10px;background:'+color+';color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:\'Hind Siliguri\',sans-serif;width:100%';
            b.onclick=fn; return b;
          }

          // JPG Download
          var base64Only=jpgDataUrl.split(',')[1];

          // JPG Download
          acts.appendChild(mkBtn('🖼️  JPG ডাউনলোড করুন','#1565C0',function(){
            if(window.AndroidBridge){
              window.AndroidBridge.saveJpg(base64Only,'slip_'+slipNo+'.jpg');
            } else {
              var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click();
            }
          }));

          // PDF / Print
          acts.appendChild(mkBtn('📄  PDF হিসেবে প্রিন্ট করুন','#333',function(){
            var w=window.open('','_blank','width=480,height=740');
            if(w){w.document.write(pdfHtml);w.document.close();setTimeout(function(){w.print();},800);}
          }));

          // WhatsApp
          acts.appendChild(mkBtn('📲  WhatsApp এ পাঠান','#25D366',function(){
            if(window.AndroidBridge){
              window.AndroidBridge.shareWhatsApp(base64Only,'slip_'+slipNo+'.jpg','com.whatsapp');
            } else if(navigator.share&&navigator.canShare){
              fetch(jpgDataUrl).then(function(r){return r.blob();}).then(function(blob){
                var file=new File([blob],'slip_'+slipNo+'.jpg',{type:'image/jpeg'});
                if(navigator.canShare({files:[file]})) navigator.share({files:[file],title:'স্লিপ '+slipNo});
                else { var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click(); }
              });
            } else {
              var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click();
              setTimeout(function(){window.open('https://web.whatsapp.com/','_blank');},1000);
            }
          }));

          // WA Business
          acts.appendChild(mkBtn('💼  WA Business এ পাঠান','#075E54',function(){
            if(window.AndroidBridge){
              window.AndroidBridge.shareWhatsApp(base64Only,'slip_'+slipNo+'.jpg','com.whatsapp.w4b');
            } else if(navigator.share&&navigator.canShare){
              fetch(jpgDataUrl).then(function(r){return r.blob();}).then(function(blob){
                var file=new File([blob],'slip_'+slipNo+'.jpg',{type:'image/jpeg'});
                if(navigator.canShare({files:[file]})) navigator.share({files:[file],title:'স্লিপ '+slipNo});
                else { var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click(); }
              });
            } else {
              var a=document.createElement('a');a.href=jpgDataUrl;a.download='slip_'+slipNo+'.jpg';a.click();
            }
          }));

          // Close
          acts.appendChild(mkBtn('✕  বন্ধ করুন','#9e9e9e',function(){
            document.getElementById('slip-overlay').remove();
          }));

        }).catch(function(e){
          iframe.remove();
          var prev=document.getElementById('slip-preview');
          if(prev) prev.innerHTML='<div style="padding:20px;color:red">ত্রুটি: '+e+'</div>';
        });
      }, 1200); // wait for Google Fonts inside iframe
    };
    sc.onerror=function(){
      iframe.remove();
      var prev=document.getElementById('slip-preview');
      if(prev) prev.innerHTML='<div style="padding:20px;color:red">html2canvas লোড হয়নি</div>';
    };
    document.head.appendChild(sc);
  }

  // Small delay so iframe renders before we grab it
  setTimeout(doCapture, 300);
}

async function loadReport() {
  var from,to;
  if(S.rptMode==='daily'){from=S.rptDate;to=S.rptDate;}
  if(S.rptMode==='monthly'){from=S.rptMonth+'-01';to=S.rptMonth+'-31';}
  if(S.rptMode==='custom'){from=S.rptFrom;to=S.rptTo;}
  if(!from||!to)return toast('তারিখ নির্বাচন করুন');
  if(from>to)return toast('শুরুর তারিখ আগে হতে হবে');
  showOvl('রিপোর্ট তৈরি হচ্ছে...');
  var r=await apiGet('/api/report?from='+from+'&to='+to);
  hideOvl();
  if(r.ok)renderRepResult(r); else toast(r.error||'ব্যর্থ');
}

function renderRepResult(r) {
  var el=document.getElementById('rep-result'); if(!el)return;
  if(r.empty){el.innerHTML='<div class="card" style="text-align:center;color:var(--mt2);padding:24px">এই সময়ের জন্য কোনো ডেটা নেই</div>';return;}
  var t=r.totals, pc=t.grossProfit>=0?'var(--gr)':'var(--re)';

    +'<div class="fg"><label class="fl">তারিখ</label><input type="date" id="exp-dt" value="'+(S.expDate||iso(new Date()))+'"></div>'

async function saveExpEntry() {
  var dt=v('exp-dt')||iso(new Date()), note=v('exp-note');
  var entries=S.expCats.map(function(c){return{categoryId:c.id,categoryName:c.name,amount:vn('exp-'+c.id)};}).filter(function(e){return e.amount>0;});
  if(!entries.length)return toast('কমপক্ষে একটি খরচের পরিমাণ দিন');
  showOvl('সংরক্ষণ হচ্ছে...');
  if(S.role==='manager'){
    var r=await mgrPost('expense',null,{date:dt,note:note,entries:entries});
    hideOvl();
    if(r&&r._mgr){toast('⏳ অনুমোদনের জন্য জমা হয়েছে!');S.expCats.forEach(function(c){sv('exp-'+c.id,'');});sv('exp-note','');return;}
    if(!r||!r.ok) return toast(r&&r.error||'ব্যর্থ');
  }
  var done=0;
  for(var i=0;i<entries.length;i++){
    var e=entries[i];
    await apiPost('/api/expenses?action=record',{action:'record',categoryId:e.categoryId,categoryName:e.categoryName,date:dt,amount:e.amount,note:note});
    done++;
  }
  hideOvl(); toast(done+'টি খরচ রেকর্ড হয়েছে');
  S.expCats.forEach(function(c){sv('exp-'+c.id,'');}); sv('exp-note','');
}

function v(id){var e=document.getElementById(id);return e?e.value:'';}
function vn(id){return Number(v(id))||0;}
function sv(id,val){var e=document.getElementById(id);if(e)e.value=val;}
function num(x){return Number(x)||0;}
function fn(n){return Math.round(Number(n)||0);}
function fm(n){var v=Number(n)||0;return v.toLocaleString('en-IN',{minimumFractionDigits:3,maximumFractionDigits:3});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function iso(d){if(d instanceof Date){var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+dd;}return String(d).slice(0,10);}
function fmtBn(d){if(!d)return'';try{var p=String(d).slice(0,10).split('-');if(p.length!==3)return String(d).slice(0,10);return p[2]+'/'+p[1]+'/'+p[0];}catch(e){return String(d).slice(0,10);}}
function prodUnit(pid){var p=(S.products||[]).find(function(x){return x.id===pid;});return p?p.unitType||'কেস':'কেস';}
function txBdg(t){var m={give:'<span class="bdg b-bl">দেওয়া</span>',return:'<span class="bdg b-te">ফেরত</span>',damage:'<span class="bdg b-re">ড্যামেজ</span>',buy:'<span class="bdg b-gr">কেনা</span>',point_sale:'<span class="bdg b-pu">পয়েন্ট সেল</span>',point_damage_return:'<span class="bdg b-re">পয়েন্ট ফেরত</span>'};return m[t]||'<span class="bdg b-gy">'+t+'</span>';}
var _ot;
function showOvl(m){document.getElementById('ovl-m').textContent=m||'লোড হচ্ছে...';document.getElementById('ovl').style.display='flex';clearTimeout(_ot);_ot=setTimeout(hideOvl,30000);}
function hideOvl(){document.getElementById('ovl').style.display='none';clearTimeout(_ot);}
var _tt;
function toast(m){var e=document.getElementById('tst');e.textContent=m;e.style.display='block';clearTimeout(_tt);_tt=setTimeout(function(){e.style.display='none';},3200);}
